server:
  port: 6790
  address: 0.0.0.0

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    # 使用 H2 替代 SQLite（纯 Java 实现，无 JNI 依赖）jdbc:h2:file:./memory
    url: jdbc:h2:file:${ASSISTANT_CONFIG_DIR:${user.dir}}/memory;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:sa123456}
    # H2 兼容模式：MODE=MySQL 使 H2 支持 SQLite 类似的 SQL 语法
    # DB_CLOSE_DELAY=-1 确保 JVM 退出时才关闭数据库
  ai:
    deepseek:
      # 仅用于满足 starter 启动校验，实际 API Key / Model 由 config.json 动态管理
      api-key: ${DEEPSEEK_API_KEY:dummy}
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s

app:
  # 配置目录：默认当前工作目录（user.dir），可通过环境变量 ASSISTANT_CONFIG_DIR 覆盖
  config-dir: ${ASSISTANT_CONFIG_DIR:${user.dir}}
  timezone: Asia/Shanghai
  max-history-chars: 6000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.laoqi.assistant.service.SchedulerService: DEBUG
    com.laoqi.assistant.service.ConfigService: DEBUG
    com.laoqi.assistant.service.FeishuService: DEBUG
    com.laoqi.assistant.controller.ImageRecognitionController: DEBUG
    com.laoqi.assistant.service.LlmService: DEBUG

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${user.dir}/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7