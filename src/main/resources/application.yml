server:
  port: 6790
  address: 0.0.0.0

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qihang-work-ai?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: qihang
    password: qihang2026
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:dummy}
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

app:
  timezone: Asia/Shanghai
  max-history-chars: 6000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      db-column-underline: true
  mapper-locations: classpath:mapper/**/*.xml

token:
  secret: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijk
  expireTime: 30

logging:
  level:
    root: INFO
    cn.qihang.ai.assistant.service.SchedulerService: DEBUG
    cn.qihang.ai.assistant.service.ConfigService: DEBUG
    cn.qihang.ai.assistant.service.FeishuService: DEBUG
    cn.qihang.ai.assistant.controller.ImageRecognitionController: DEBUG
    cn.qihang.ai.assistant.service.LlmService: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${user.dir}/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7