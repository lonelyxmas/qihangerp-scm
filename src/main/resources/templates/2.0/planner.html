<div class="planner-page">
    <div class="page-header">
        <h2>📋 计划</h2>
    </div>
    <div style="margin-bottom:20px;font-size:13px;color:#909296;">
        管理任务和定时提醒
        <span th:if="${error}" style="color:#e03131;margin-left:8px;">⚠️ <span th:text="${error}">错误</span></span>
    </div>

    <!-- 任务看板 -->
    <div class="section-header">
        <h2>📋 任务看板 <span class="count" id="task-total-count" th:text="${tasks.size()}">0</span></h2>
        <button class="btn btn-primary" onclick="showAddTaskModal()">+ 添加任务</button>
    </div>
    <div id="task-board-container"></div>

    <div class="section-divider"></div>

    <!-- 定时提醒 -->
    <div class="section-header">
        <h2>⏰ 定时提醒 <span class="count" id="reminder-total-count">0</span></h2>
        <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:13px;color:#909296;">已启用: <span id="enabled-count">0</span></span>
            <button class="btn btn-primary" onclick="showAddReminderModal()">+ 添加提醒</button>
        </div>
    </div>
    <div id="reminder-grid"></div>
    <div id="reminder-empty" style="display:none;text-align:center;padding:40px 20px;border:2px dashed #d9d0ff;background:#fafafe;border-radius:12px;">
        <div style="font-size:48px;margin-bottom:12px;">⏰</div>
        <div style="font-size:16px;font-weight:600;color:#7c5cfc;margin-bottom:8px;">暂无提醒</div>
        <div style="color:#909296;margin-bottom:16px;">点击上方「添加提醒」按钮创建一个新的定时提醒</div>
    </div>

    <!-- 任务弹窗 -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal" style="width:520px;">
            <h3 id="task-modal-title">添加任务</h3>
            <input type="hidden" id="task-id">
            <div class="form-group"><label>标题 *</label><input type="text" id="task-title" placeholder="任务标题"></div>
            <div class="form-group"><label>描述</label><textarea id="task-description" rows="3" placeholder="任务描述（可选）"></textarea></div>
            <div class="form-row">
                <div class="form-group">
                    <label>优先级</label>
                    <select id="task-priority">
                        <option value="high">🔴 高优先级</option>
                        <option value="mid" selected>🟡 中优先级</option>
                        <option value="low">🟢 低优先级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="date" id="task-dueDate">
                </div>
            </div>
            <div class="form-group" id="edit-status-group" style="display:none;">
                <label>状态</label>
                <select id="task-status">
                    <option value="pending">📋 待办</option>
                    <option value="in_progress">🔄 进行中</option>
                    <option value="done">✅ 已完成</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('task-modal')">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <!-- 提醒弹窗 -->
    <div class="modal-overlay" id="reminder-modal">
        <div class="modal" style="width:560px;max-width:95vw;">
            <h3 id="reminder-modal-title">添加提醒</h3>
            <input type="hidden" id="reminder-id">
            <div class="form-group"><label>提醒名称 *</label><input type="text" id="reminder-name" placeholder="例如：下班日报提醒"></div>
            <div class="form-group"><label>提醒消息</label><textarea id="reminder-message" rows="3" placeholder="提醒内容（可选）"></textarea></div>
            <div class="form-group">
                <label>提醒类型 *</label>
                <select id="reminder-type" onchange="onReminderTypeChange()">
                    <option value="daily">📅 每天 - 每天定时提醒</option>
                    <option value="once">🔔 一次 - 指定日期提醒</option>
                    <option value="weekly">📆 每周 - 每周特定星期几提醒</option>
                    <option value="monthly">📅 每月 - 每月特定几号提醒</option>
                    <option value="yearly">🎂 每年 - 每年特定日期提醒</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;"><label>提醒时间 *</label><input type="time" id="reminder-time" value="09:00"></div>
                <div class="form-group" id="reminder-weekday-group" style="flex:1;display:none;"><label>星期几</label><select id="reminder-dayOfWeek"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div>
                <div class="form-group" id="reminder-once-group" style="flex:1;display:none;"><label>日期</label><input type="date" id="reminder-date"></div>
                <div class="form-group" id="reminder-monthly-group" style="flex:1;display:none;"><label>几号</label><input type="number" id="reminder-dayOfMonth" min="1" max="31" placeholder="1-31"></div>
                <div class="form-group" id="reminder-yearly-group" style="flex:2;display:none;"><label>几月几号</label><div style="display:flex;gap:8px;align-items:center;"><input type="number" id="reminder-yearMonth" min="1" max="12" placeholder="月" style="width:60px;"><span>月</span><input type="number" id="reminder-yearDay" min="1" max="31" placeholder="日" style="width:60px;"><span>日</span></div></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('reminder-modal')">取消</button>
                <button class="btn btn-primary" onclick="saveReminder()">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal" style="width:400px;">
            <h3>确认删除</h3>
            <p style="color:#909296;font-size:13px;">确定要删除这个提醒吗？此操作不可撤销。</p>
            <input type="hidden" id="delete-id">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('delete-modal')">取消</button>
                <button class="btn btn-danger" onclick="confirmDeleteReminder()">删除</button>
            </div>
        </div>
    </div>
