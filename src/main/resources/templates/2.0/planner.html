<div class="planner-page">
    <div class="page-header">
        <h2>📋 计划</h2>
    </div>
    <div style="margin-bottom:20px;font-size:13px;color:#909296;">
        管理任务和定时提醒
        <span th:if="${error}" style="color:#e03131;margin-left:8px;">⚠️ <span th:text="${error}">错误</span></span>
    </div>

    <!-- 任务看板 -->
    <div class="section-header">
        <h2>📋 任务看板 <span class="count" id="task-total-count" th:text="${tasks.size()}">0</span></h2>
        <button class="btn btn-primary" onclick="showAddTaskModal()">+ 添加任务</button>
    </div>
    <div id="task-board-container"></div>

    <div class="section-divider"></div>

    <!-- 定时提醒 -->
    <div class="section-header">
        <h2>⏰ 定时提醒 <span class="count" id="reminder-total-count">0</span></h2>
        <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:13px;color:#909296;">已启用: <span id="enabled-count">0</span></span>
            <button class="btn btn-primary" onclick="showAddReminderModal()">+ 添加提醒</button>
        </div>
    </div>
    <div id="reminder-grid"></div>
    <div id="reminder-empty" style="display:none;text-align:center;padding:40px 20px;border:2px dashed #d9d0ff;background:#fafafe;border-radius:12px;">
        <div style="font-size:48px;margin-bottom:12px;">⏰</div>
        <div style="font-size:16px;font-weight:600;color:#7c5cfc;margin-bottom:8px;">暂无提醒</div>
        <div style="color:#909296;margin-bottom:16px;">点击上方「添加提醒」按钮创建一个新的定时提醒</div>
    </div>

    <!-- 任务弹窗 -->
    <div class="modal-overlay" id="task-modal">
        <div class="modal" style="width:520px;">
            <h3 id="task-modal-title">添加任务</h3>
            <input type="hidden" id="task-id">
            <div class="form-group"><label>标题 *</label><input type="text" id="task-title" placeholder="任务标题"></div>
            <div class="form-group"><label>描述</label><textarea id="task-description" rows="3" placeholder="任务描述（可选）"></textarea></div>
            <div class="form-row">
                <div class="form-group">
                    <label>优先级</label>
                    <select id="task-priority">
                        <option value="high">🔴 高优先级</option>
                        <option value="mid" selected>🟡 中优先级</option>
                        <option value="low">🟢 低优先级</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="date" id="task-dueDate">
                </div>
            </div>
            <div class="form-group" id="edit-status-group" style="display:none;">
                <label>状态</label>
                <select id="task-status">
                    <option value="pending">📋 待办</option>
                    <option value="in_progress">🔄 进行中</option>
                    <option value="done">✅ 已完成</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('task-modal')">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <!-- 提醒弹窗 -->
    <div class="modal-overlay" id="reminder-modal">
        <div class="modal" style="width:560px;max-width:95vw;">
            <h3 id="reminder-modal-title">添加提醒</h3>
            <input type="hidden" id="reminder-id">
            <div class="form-group"><label>提醒名称 *</label><input type="text" id="reminder-name" placeholder="例如：下班日报提醒"></div>
            <div class="form-group"><label>提醒消息</label><textarea id="reminder-message" rows="3" placeholder="提醒内容（可选）"></textarea></div>
            <div class="form-group">
                <label>提醒类型 *</label>
                <select id="reminder-type" onchange="onReminderTypeChange()">
                    <option value="daily">📅 每天 - 每天定时提醒</option>
                    <option value="once">🔔 一次 - 指定日期提醒</option>
                    <option value="weekly">📆 每周 - 每周特定星期几提醒</option>
                    <option value="monthly">📅 每月 - 每月特定几号提醒</option>
                    <option value="yearly">🎂 每年 - 每年特定日期提醒</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;"><label>提醒时间 *</label><input type="time" id="reminder-time" value="09:00"></div>
                <div class="form-group" id="reminder-weekday-group" style="flex:1;display:none;"><label>星期几</label><select id="reminder-dayOfWeek"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div>
                <div class="form-group" id="reminder-once-group" style="flex:1;display:none;"><label>日期</label><input type="date" id="reminder-date"></div>
                <div class="form-group" id="reminder-monthly-group" style="flex:1;display:none;"><label>几号</label><input type="number" id="reminder-dayOfMonth" min="1" max="31" placeholder="1-31"></div>
                <div class="form-group" id="reminder-yearly-group" style="flex:2;display:none;"><label>几月几号</label><div style="display:flex;gap:8px;align-items:center;"><input type="number" id="reminder-yearMonth" min="1" max="12" placeholder="月" style="width:60px;"><span>月</span><input type="number" id="reminder-yearDay" min="1" max="31" placeholder="日" style="width:60px;"><span>日</span></div></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('reminder-modal')">取消</button>
                <button class="btn btn-primary" onclick="saveReminder()">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal" style="width:400px;">
            <h3>确认删除</h3>
            <p style="color:#909296;font-size:13px;">确定要删除这个提醒吗？此操作不可撤销。</p>
            <input type="hidden" id="delete-id">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('delete-modal')">取消</button>
                <button class="btn btn-danger" onclick="confirmDeleteReminder()">删除</button>
            </div>
        </div>
    </div>

    <!-- ========== 计划页 JS ========== -->
    <script th:inline="javascript">
    /*<![CDATA[*/
    // 从服务端获取数据
    var serverTasks = /*[[${tasks}]]*/ [];
    var serverReminders = /*[[${reminders}]]*/ [];
    /*]]>*/

    // ========== 通用工具 ==========
    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }
    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    // ========== 任务管理 ==========
    function showAddTaskModal() {
        document.getElementById('task-modal-title').textContent = '添加任务';
        document.getElementById('task-id').value = '';
        document.getElementById('task-title').value = '';
        document.getElementById('task-description').value = '';
        document.getElementById('task-priority').value = 'mid';
        document.getElementById('task-dueDate').value = '';
        document.getElementById('edit-status-group').style.display = 'none';
        openModal('task-modal');
    }

    function showEditTaskModal(task) {
        document.getElementById('task-modal-title').textContent = '编辑任务';
        document.getElementById('task-id').value = task.id;
        document.getElementById('task-title').value = task.title;
        document.getElementById('task-description').value = task.description || '';
        document.getElementById('task-priority').value = task.priority;
        document.getElementById('task-dueDate').value = task.dueDate || '';
        document.getElementById('task-status').value = task.status;
        document.getElementById('edit-status-group').style.display = '';
        openModal('task-modal');
    }

    async function saveTask() {
        var id = document.getElementById('task-id').value;
        var title = document.getElementById('task-title').value.trim();
        var description = document.getElementById('task-description').value.trim();
        var priority = document.getElementById('task-priority').value;
        var dueDate = document.getElementById('task-dueDate').value;
        var status = document.getElementById('task-status').value;

        if (!title) { toast('请填写任务标题', 'error'); return; }

        var params = new URLSearchParams();
        params.append('title', title);
        params.append('description', description);
        params.append('priority', priority);
        params.append('dueDate', dueDate);
        if (id) {
            params.append('id', id);
            params.append('status', status);
            var url = '/api/tasks/update';
        } else {
            var url = '/api/tasks/add';
        }

        try {
            var resp = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            });
            var result = await resp.json();
            if (result.ok) {
                toast(id ? '任务已更新' : '任务已添加');
                closeModal('task-modal');
                location.reload();
            } else {
                toast(result.error || '保存失败', 'error');
            }
        } catch(e) {
            toast('请求失败: ' + e.message, 'error');
        }
    }

    async function deleteTask(id) {
        if (!confirm('确定要删除这个任务吗？')) return;
        try {
            var resp = await fetch('/api/tasks/delete?id=' + encodeURIComponent(id), { method: 'POST' });
            var result = await resp.json();
            if (result.ok) {
                toast('任务已删除');
                location.reload();
            } else {
                toast(result.error || '删除失败', 'error');
            }
        } catch(e) {
            toast('请求失败: ' + e.message, 'error');
        }
    }

    // ========== 提醒管理 ==========
    function showAddReminderModal() {
        document.getElementById('reminder-modal-title').textContent = '添加提醒';
        document.getElementById('reminder-id').value = '';
        document.getElementById('reminder-name').value = '';
        document.getElementById('reminder-message').value = '';
        document.getElementById('reminder-type').value = 'daily';
        document.getElementById('reminder-time').value = '09:00';
        onReminderTypeChange();
        openModal('reminder-modal');
    }

    function showEditReminderModal(reminder) {
        document.getElementById('reminder-modal-title').textContent = '编辑提醒';
        document.getElementById('reminder-id').value = reminder.id;
        document.getElementById('reminder-name').value = reminder.name;
        document.getElementById('reminder-message').value = reminder.message || '';
        document.getElementById('reminder-type').value = reminder.type;
        document.getElementById('reminder-time').value = reminder.time || '09:00';

        // 填充特定类型的字段
        if (reminder.type === 'once') {
            document.getElementById('reminder-date').value = reminder.date || '';
        } else if (reminder.type === 'weekly') {
            document.getElementById('reminder-dayOfWeek').value = reminder.dayOfWeek || '1';
        } else if (reminder.type === 'monthly') {
            document.getElementById('reminder-dayOfMonth').value = reminder.dayOfMonth || '';
        } else if (reminder.type === 'yearly') {
            document.getElementById('reminder-yearMonth').value = reminder.monthDay ? reminder.monthDay.split('-')[0] : '';
            document.getElementById('reminder-yearDay').value = reminder.monthDay ? reminder.monthDay.split('-')[1] : '';
        }

        onReminderTypeChange();
        openModal('reminder-modal');
    }

    function onReminderTypeChange() {
        var type = document.getElementById('reminder-type').value;
        document.getElementById('reminder-weekday-group').style.display = type === 'weekly' ? '' : 'none';
        document.getElementById('reminder-once-group').style.display = type === 'once' ? '' : 'none';
        document.getElementById('reminder-monthly-group').style.display = type === 'monthly' ? '' : 'none';
        document.getElementById('reminder-yearly-group').style.display = type === 'yearly' ? '' : 'none';
    }

    async function saveReminder() {
        var id = document.getElementById('reminder-id').value;
        var name = document.getElementById('reminder-name').value.trim();
        var message = document.getElementById('reminder-message').value.trim();
        var type = document.getElementById('reminder-type').value;
        var time = document.getElementById('reminder-time').value;

        if (!name) { toast('请填写提醒名称', 'error'); return; }
        if (!time) { toast('请选择提醒时间', 'error'); return; }

        var params = new URLSearchParams();
        params.append('name', name);
        params.append('message', message);
        params.append('type', type);
        params.append('time', time);

        if (type === 'once') {
            params.append('date', document.getElementById('reminder-date').value);
            if (!document.getElementById('reminder-date').value) { toast('请选择日期', 'error'); return; }
        } else if (type === 'weekly') {
            params.append('dayOfWeek', document.getElementById('reminder-dayOfWeek').value);
        } else if (type === 'monthly') {
            var dayOfMonth = parseInt(document.getElementById('reminder-dayOfMonth').value);
            if (!dayOfMonth || dayOfMonth < 1 || dayOfMonth > 31) { toast('请输入有效的日期(1-31)', 'error'); return; }
            params.append('dayOfMonth', dayOfMonth);
        } else if (type === 'yearly') {
            var month = parseInt(document.getElementById('reminder-yearMonth').value);
            var day = parseInt(document.getElementById('reminder-yearDay').value);
            if (!month || !day || month < 1 || month > 12 || day < 1 || day > 31) { toast('请输入有效的月份和日期', 'error'); return; }
            params.append('monthDay', month + '-' + day);
        }

        if (id) {
            params.append('id', id);
            var url = '/api/reminders/update';
        } else {
            var url = '/api/reminders/add';
        }

        try {
            var resp = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            });
            var result = await resp.json();
            if (result.ok) {
                toast(id ? '提醒已更新' : '提醒已添加');
                closeModal('reminder-modal');
                location.reload();
            } else {
                toast(result.error || '保存失败', 'error');
            }
        } catch(e) {
            toast('请求失败: ' + e.message, 'error');
        }
    }

    function showDeleteModal(id) {
        document.getElementById('delete-id').value = id;
        openModal('delete-modal');
    }

    async function confirmDeleteReminder() {
        var id = document.getElementById('delete-id').value;
        if (!id) return;
        try {
            var resp = await fetch('/api/reminders/delete?id=' + encodeURIComponent(id), { method: 'POST' });
            var result = await resp.json();
            if (result.ok) {
                toast('提醒已删除');
                closeModal('delete-modal');
                location.reload();
            } else {
                toast(result.error || '删除失败', 'error');
            }
        } catch(e) {
            toast('请求失败: ' + e.message, 'error');
        }
    }

    // ========== 渲染任务看板 ==========
    function renderTaskBoard(tasks) {
        var container = document.getElementById('task-board-container');
        if (!container || !tasks || tasks.length === 0) {
            if (container) {
                container.innerHTML = '<div style="text-align:center;padding:30px;color:#909296;font-size:13px;">暂无任务，点击上方「添加任务」创建</div>';
            }
            return;
        }

        var pending = tasks.filter(function(t) { return t.status === 'pending'; });
        var inProgress = tasks.filter(function(t) { return t.status === 'in_progress'; });
        var done = tasks.filter(function(t) { return t.status === 'done'; });

        var columns = [
            { title: '📋 待办', items: pending, color: '#e03131' },
            { title: '🔄 进行中', items: inProgress, color: '#e8590c' },
            { title: '✅ 已完成', items: done, color: '#2b8a3e' }
        ];

        var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">';
        columns.forEach(function(col) {
            html += '<div style="background:#f8f9fa;border-radius:8px;padding:12px;">';
            html += '<div style="font-size:13px;font-weight:600;color:#1a1b1e;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">';
            html += '<span>' + col.title + '</span>';
            html += '<span style="font-size:11px;color:#909296;font-weight:400;">' + col.items.length + '</span>';
            html += '</div>';

            if (col.items.length === 0) {
                html += '<div style="text-align:center;padding:16px;color:#c2c5cc;font-size:12px;">暂无</div>';
            } else {
                col.items.forEach(function(t) {
                    var priorityIcon = t.priority === 'high' ? '🔴' : (t.priority === 'mid' ? '🟡' : '🟢');
                    var dueLabel = t.dueDate ? '<div style="font-size:11px;color:#909296;margin-top:4px;">📅 ' + t.dueDate + '</div>' : '';
                    html += '<div style="background:#fff;border:1px solid #eef0f4;border-radius:6px;padding:10px;margin-bottom:6px;cursor:pointer;" onclick="showEditTaskModal({id:\''+t.id+'\',title:\''+escapeForJS(t.title)+'\',description:\''+escapeForJS(t.description||'')+'\',priority:\''+t.priority+'\',dueDate:\''+t.dueDate+'\',status:\''+t.status+'\'})">';
                    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
                    html += '<div style="font-size:13px;font-weight:500;color:#1a1b1e;flex:1;">' + priorityIcon + ' ' + escapeHtml(t.title) + '</div>';
                    html += '<div style="display:flex;gap:4px;">';
                    html += '<button onclick="event.stopPropagation();deleteTask(\''+t.id+'\')" style="background:none;border:none;cursor:pointer;font-size:12px;color:#c2c5cc;padding:2px;" title="删除">✕</button>';
                    html += '</div>';
                    html += '</div>';
                    if (t.description) {
                        html += '<div style="font-size:12px;color:#5c5f66;margin-top:4px;line-height:1.4;">' + escapeHtml(t.description) + '</div>';
                    }
                    html += dueLabel;
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
    }

    // ========== 渲染提醒列表 ==========
    function renderReminders(reminders) {
        var grid = document.getElementById('reminder-grid');
        var empty = document.getElementById('reminder-empty');
        var totalCount = document.getElementById('reminder-total-count');
        var enabledCount = document.getElementById('enabled-count');

        if (!grid || !reminders) return;

        if (reminders.length === 0) {
            grid.style.display = 'none';
            if (empty) empty.style.display = '';
            if (totalCount) totalCount.textContent = '0';
            if (enabledCount) enabledCount.textContent = '0';
            return;
        }

        grid.style.display = '';
        if (empty) empty.style.display = 'none';

        var enabled = reminders.filter(function(r) { return r.enabled; });
        if (totalCount) totalCount.textContent = reminders.length;
        if (enabledCount) enabledCount.textContent = enabled.length;

        var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">';
        reminders.forEach(function(r) {
            var typeIcon = r.type === 'daily' ? '📅' : r.type === 'once' ? '🔔' : r.type === 'weekly' ? '📆' : r.type === 'monthly' ? '📅' : '🎂';
            var statusBadge = r.enabled
                ? '<span class="badge badge-ok" style="font-size:10px;padding:1px 6px;">已启用</span>'
                : '<span class="badge badge-info" style="font-size:10px;padding:1px 6px;color:#909296;background:#f5f5f7;border-color:#eef0f4;">已暂停</span>';

            html += '<div style="background:#fff;border:1px solid #eef0f4;border-radius:8px;padding:14px;">';
            html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">';
            html += '<div style="font-size:14px;font-weight:600;color:#1a1b1e;flex:1;">' + typeIcon + ' ' + escapeHtml(r.name) + '</div>';
            html += statusBadge;
            html += '</div>';

            if (r.message) {
                html += '<div style="font-size:12px;color:#5c5f66;margin-bottom:6px;line-height:1.4;">' + escapeHtml(r.message) + '</div>';
            }
            html += '<div style="font-size:12px;color:#7c5cfc;margin-bottom:6px;">⏰ ' + r.time + ' - ' + escapeHtml(r.description || '') + '</div>';

            if (r.lastTriggered) {
                html += '<div style="font-size:11px;color:#909296;">上次: ' + escapeHtml(r.lastTriggered) + '</div>';
            }

            html += '<div style="display:flex;gap:4px;margin-top:8px;">';
            html += '<button onclick="showEditReminderModal({id:\''+r.id+'\',name:\''+escapeForJS(r.name)+'\',message:\''+escapeForJS(r.message||'')+'\',type:\''+r.type+'\',time:\''+r.time+'\',date:\''+escapeForJS(r.date||'')+'\',dayOfWeek:\''+r.dayOfWeek+'\',dayOfMonth:\''+r.dayOfMonth+'\',monthDay:\''+escapeForJS(r.monthDay||'')+'\'}')" style="background:none;border:1px solid #eef0f4;border-radius:4px;cursor:pointer;font-size:11px;padding:3px 8px;color:#5c5f66;">编辑</button>';
            html += '<button onclick="toggleReminder(\''+r.id+'\','+r.enabled+')" style="background:none;border:1px solid #eef0f4;border-radius:4px;cursor:pointer;font-size:11px;padding:3px 8px;color:'+(r.enabled?'#e03131':'#2b8a3e')+';">' + (r.enabled ? '暂停' : '启用') + '</button>';
            html += '<button onclick="showDeleteModal(\''+r.id+'\')" style="background:none;border:1px solid #eef0f4;border-radius:4px;cursor:pointer;font-size:11px;padding:3px 8px;color:#e03131;">删除</button>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        grid.innerHTML = html;
    }

    async function toggleReminder(id, currentEnabled) {
        try {
            var resp = await fetch('/api/reminders/toggle?id=' + encodeURIComponent(id), { method: 'POST' });
            var result = await resp.json();
            if (result.ok) {
                toast(currentEnabled ? '提醒已暂停' : '提醒已启用');
                location.reload();
            } else {
                toast(result.error || '操作失败', 'error');
            }
        } catch(e) {
            toast('请求失败: ' + e.message, 'error');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function escapeForJS(text) {
        if (!text) return '';
        return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

// 页面加载后渲染（始终调用，包括空数据时显示空状态）
    document.addEventListener('DOMContentLoaded', function() {
        renderTaskBoard(serverTasks || []);
        renderReminders(serverReminders || []);
    });
    </script>
