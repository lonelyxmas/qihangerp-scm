<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: '笔灵 AI'}">笔灵 AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #ffffff;
            --bg-sidebar: #f8fafc;
            --bg-card: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; }
        .sidebar-header { padding: 0 16px 16px; }
        .sidebar-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-title svg { width: 24px; height: 24px; }
        
        .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; color: var(--text-secondary); font-size: 14px; transition: all 0.2s; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
        .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
        .kb-selector { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; font-size: 13px; color: var(--text-primary); outline: none; cursor: pointer; }
        .kb-selector:hover { border-color: var(--primary); }
        .kb-selector:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        
        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .content-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .content-actions { display: flex; gap: 8px; }
        
        .content-body { flex: 1; overflow-y: auto; padding: 24px; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--hover); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        /* Cards */
        .card { background: white; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 16px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; }
        
        /* Inputs */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; transition: all 0.2s; background: white; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        
        /* Badges */
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-primary { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
        .badge-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .badge-warning { background: rgba(251, 146, 60, 0.1); color: #fb923c; }
        .badge-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-title { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }
        .empty-state-desc { font-size: 14px; line-height: 1.6; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                笔灵 AI
            </div>
        </div>
        
        <nav class="nav-menu">
            <div class="nav-item active" onclick="navigate('/v3/chat')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                对话
            </div>
            <div class="nav-item" onclick="navigate('/v3/ai')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5-2 4-2 4 2 4 2"/>
                    <circle cx="9" cy="9" r="1"/>
                    <circle cx="15" cy="9" r="1"/>
                </svg>
                AI 概览
            </div>
            <div class="nav-item" onclick="navigate('/v3/notes')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                笔记
            </div>
            <div class="nav-item" onclick="navigate('/v3/data')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="12" y1="12" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="12" y2="12"/>
                </svg>
                数据
            </div>
            <div class="nav-item" onclick="navigate('/v3/planner')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                任务提醒
            </div>
        </nav>
        
        <div class="sidebar-footer">
            <select id="kbSelector" class="kb-selector" onchange="onKbChange()">
                <option value="">全部笔记库</option>
                <option th:each="kb : ${kbList}" th:value="${kb.id}" th:text="${kb.name}"></option>
            </select>
        </div>
    </aside>
    
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title" th:text="${pageTitle ?: '对话'}">对话</h1>
            <div class="content-actions" id="contentActions">
                <slot name="actions"></slot>
            </div>
        </div>
        <div class="content-body" id="contentBody">
            <slot name="content"></slot>
        </div>
    </main>
    
    <script>
        function navigate(url) {
            var kbId = document.getElementById('kbSelector').value;
            if (kbId) {
                url += '?kbId=' + kbId;
            }
            window.location.href = url;
        }
        
        function onKbChange() {
            var path = window.location.pathname;
            if (path.startsWith('/v3/')) {
                navigate(path);
            }
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return '';
            var date = new Date(timeStr);
            var now = new Date();
            var diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            
            var month = date.getMonth() + 1;
            var day = date.getDate();
            var hour = date.getHours().toString().padStart(2, '0');
            var minute = date.getMinutes().toString().padStart(2, '0');
            return month + '月' + day + '日 ' + hour + ':' + minute;
        }
        
        function parseMarkdown(text) {
            if (!text) return '';
            try {
                return marked.parse(text);
            } catch (e) {
                return text.replace(/\n/g, '<br>');
            }
        }
    </script>
</body>
</html>
