<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css">
    <title>启航 AI 协作平台 - 定时提醒</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <style>
        .card { background: white; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; }
        
        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--hover); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        
        .task-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .task-column { background: #f8fafc; border-radius: var(--radius-md); padding: 16px; }
        .column-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .column-title { font-size: 14px; font-weight: 600; }
        .column-count { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .column-pending .column-count { background: rgba(251,146,60,0.1); color: #fb923c; }
        .column-progress .column-count { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .column-done .column-count { background: rgba(34,197,94,0.1); color: #22c55e; }
        
        .task-card { background: white; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); }
        .task-card:hover { box-shadow: var(--shadow-md); }
        .task-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .task-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
        .priority-high { color: #ef4444; }
        .priority-mid { color: #fb923c; }
        .priority-low { color: #22c55e; }
        .task-due { display: flex; align-items: center; gap: 2px; }
        
        .reminder-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .reminder-card { background: white; border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .reminder-card:hover { box-shadow: var(--shadow-md); }
        .reminder-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .reminder-name { font-size: 14px; font-weight: 600; }
        .reminder-toggle { width: 40px; height: 22px; border-radius: 11px; background: #e2e8f0; cursor: pointer; position: relative; transition: all 0.2s; }
        .reminder-toggle.on { background: var(--primary); }
        .reminder-toggle::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: white; top: 2px; left: 2px; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .reminder-toggle.on::after { left: 20px; }
        .reminder-message { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .reminder-schedule { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: var(--radius-md); padding: 24px; width: 520px; max-width: 95vw; box-shadow: 0 20px 25px rgba(0,0,0,0.1); }
        .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        
        .section-divider { height: 1px; background: var(--border); margin: 24px 0; }
        
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>
    
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">定时提醒</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <a href="/tasks" class="btn btn-secondary" style="text-decoration:none;">📋 任务中心</a>
            </div>
        </div>
        
        <div class="content-body" id="app">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">⏰ 定时提醒</h2>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <span style="font-size:13px;color:#94a3b8;">已启用: {{ enabledReminderCount }}</span>
                        <button class="btn btn-primary" @click="showAddReminderModal()">+ 添加提醒</button>
                    </div>
                </div>
                <div v-if="reminders.length === 0" style="text-align:center;padding:40px 20px;border:2px dashed #e2e8f0;background:#f8fafc;border-radius:var(--radius-md);">
                    <div style="font-size:48px;margin-bottom:12px;">⏰</div>
                    <div style="font-size:16px;font-weight:500;margin-bottom:8px;color:#64748b;">暂无提醒</div>
                    <div style="font-size:14px;color:#94a3b8;">点击上方「添加提醒」按钮创建一个新的定时提醒</div>
                </div>
                <div v-else class="reminder-grid">
                    <div v-for="reminder in reminders" :key="reminder.id" class="reminder-card">
                        <div class="reminder-header">
                            <span class="reminder-name">{{ reminder.name }}</span>
                            <div :class="['reminder-toggle', { on: reminder.enabled }]" @click="toggleReminder(reminder.id)"></div>
                        </div>
                        <div v-if="reminder.message" class="reminder-message">{{ reminder.message }}</div>
                        <div class="reminder-schedule">
                            <span>⏰</span>
                            <span>{{ getScheduleText(reminder) }}</span>
                        </div>
                        <div style="margin-top:12px;display:flex;gap:8px;">
                            <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px;" @click="showEditReminderModal(reminder.id)">编辑</button>
                            <button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" @click="openDeleteModal(reminder.id, 'reminder')">删除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div class="modal-overlay" :class="{ show: showReminderModal }" @click.self="showReminderModal = false">
        <div class="modal">
            <h3>{{ isEditingReminder ? '编辑提醒' : '添加提醒' }}</h3>
            <input type="hidden" v-model="editingReminder.id">
            <div class="form-group"><label>提醒名称 *</label><input type="text" v-model="editingReminder.name" class="form-control" placeholder="例如：下班日报提醒"></div>
            <div class="form-group"><label>提醒消息</label><textarea v-model="editingReminder.message" class="form-control" rows="3" placeholder="提醒内容（可选）"></textarea></div>
            <div class="form-group">
                <label>提醒类型 *</label>
                <select v-model="editingReminder.type" class="form-control" @change="onReminderTypeChange()">
                    <option value="daily">📅 每天 - 每天定时提醒</option>
                    <option value="once">🔔 一次 - 指定日期提醒</option>
                    <option value="weekly">📆 每周 - 每周特定星期几提醒</option>
                    <option value="monthly">📅 每月 - 每月特定几号提醒</option>
                    <option value="yearly">🎂 每年 - 每年特定日期提醒</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1;"><label>提醒时间 *</label><input type="time" v-model="editingReminder.time" class="form-control" value="09:00"></div>
                <div class="form-group" v-if="editingReminder.type === 'weekly'" style="flex:1;"><label>星期几</label><select v-model="editingReminder.dayOfWeek" class="form-control"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div>
                <div class="form-group" v-if="editingReminder.type === 'once'" style="flex:1;"><label>日期</label><input type="date" v-model="editingReminder.date" class="form-control"></div>
                <div class="form-group" v-if="editingReminder.type === 'monthly'" style="flex:1;"><label>几号</label><input type="number" v-model="editingReminder.dayOfMonth" class="form-control" min="1" max="31" placeholder="1-31"></div>
                <div class="form-group" v-if="editingReminder.type === 'yearly'" style="flex:2;"><label>几月几号</label><div style="display:flex;gap:8px;align-items:center;"><input type="number" v-model="reminderYearMonth" class="form-control" min="1" max="12" placeholder="月" style="width:60px;"><span>月</span><input type="number" v-model="reminderYearDay" class="form-control" min="1" max="31" placeholder="日" style="width:60px;"><span>日</span></div></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" @click="showReminderModal = false">取消</button>
                <button class="btn btn-primary" @click="saveReminder()">保存</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" :class="{ show: showDeleteModal }" @click.self="showDeleteModal = false">
        <div class="modal" style="width:400px;">
            <h3>确认删除</h3>
            <p style="color:#94a3b8;font-size:13px;">确定要删除吗？此操作不可撤销。</p>
            <input type="hidden" v-model="deleteId">
            <input type="hidden" v-model="deleteType">
            <div class="modal-actions">
                <button class="btn btn-secondary" @click="showDeleteModal = false">取消</button>
                <button class="btn btn-danger" @click="confirmDelete()">删除</button>
            </div>
        </div>
    </div>
    
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const API_BASE = '/api';

        function apiFetch(url, options) {
            if (!options) options = {};
            if (!options.headers) options.headers = {};
            var token = localStorage.getItem('Admin-Token');
            if (token) options.headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, options);
        }

        function isAuthError(d) {
            return d.__401 || (d.code === 500 && d.msg === '认证失败');
        }

        function handleUnauthenticated() {
            localStorage.removeItem('Admin-Token');
            document.cookie = 'Admin-Token=; path=/; max-age=0; SameSite=Lax';
            document.getElementById('app').innerHTML = '<div class="empty-state"><div class="empty-icon">🔐</div><div class="empty-title">需要登录</div><div class="empty-desc">登录后即可使用任务管理功能</div></div>';
            showLoginModal(function() { window.location.href = window.location.href; });
        }

        function checkAuthBeforeFetch(url, opts) {
            return apiFetch(url, opts).then(function(r) {
                if (r.status === 401 || r.status === 403) return r.json().then(function(d) { d.__401 = true; return d; });
                if (!r.ok) throw new Error('请求失败');
                return r.json();
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            var token = localStorage.getItem('Admin-Token');
            if (!token) { handleUnauthenticated(); return; }
        });

        document.addEventListener('auth-change', function() {
            if (!localStorage.getItem('Admin-Token')) handleUnauthenticated();
        });

        createApp({
            setup() {
                const currentKbId = ref(/*[[${selectedKb != null ? selectedKb.id : null}]]*/ null);
                const reminders = ref([]);
                
                const showReminderModal = ref(false);
                const isEditingReminder = ref(false);
                const editingReminder = ref({
                    id: '',
                    name: '',
                    message: '',
                    type: 'daily',
                    time: '09:00',
                    date: '',
                    dayOfWeek: '1',
                    dayOfMonth: '',
                    monthDay: ''
                });
                const reminderYearMonth = ref('');
                const reminderYearDay = ref('');
                
                const showDeleteModal = ref(false);
                const deleteId = ref('');
                const deleteType = ref('');

                const enabledReminderCount = computed(() => reminders.value.filter(r => r.enabled).length);

                async function loadReminders() {
                    let url = '/api/reminders';
                    if (currentKbId.value) url += '?kbId=' + currentKbId.value;
                    
                    const r = await checkAuthBeforeFetch(url);
                    if (isAuthError(r)) { handleUnauthenticated(); return; }
                    reminders.value = r;
                }

                function showAddReminderModal() {
                    isEditingReminder.value = false;
                    editingReminder.value = {
                        id: '', name: '', message: '', type: 'daily',
                        time: '09:00', date: '', dayOfWeek: '1', dayOfMonth: '', monthDay: ''
                    };
                    reminderYearMonth.value = '';
                    reminderYearDay.value = '';
                    showReminderModal.value = true;
                }

                function showEditReminderModal(id) {
                    const reminder = reminders.value.find(r => r.id === id);
                    if (!reminder) return;
                    
                    isEditingReminder.value = true;
                    editingReminder.value = { ...reminder };
                    
                    const monthDay = (reminder.monthDay || '').split('-');
                    reminderYearMonth.value = monthDay[0] || '';
                    reminderYearDay.value = monthDay[1] || '';
                    
                    showReminderModal.value = true;
                }

                function onReminderTypeChange() {}

                async function saveReminder() {
                    if (!editingReminder.value.name.trim()) {
                        alert('请输入提醒名称');
                        return;
                    }
                    
                    const monthDay = reminderYearMonth.value && reminderYearDay.value 
                        ? reminderYearMonth.value + '-' + reminderYearDay.value 
                        : '';
                    
                    let url = editingReminder.value.id ? '/api/reminders/update' : '/api/reminders/add';
                    const formData = new FormData();
                    formData.append('name', editingReminder.value.name);
                    formData.append('message', editingReminder.value.message || '');
                    formData.append('type', editingReminder.value.type);
                    formData.append('time', editingReminder.value.time);
                    formData.append('date', editingReminder.value.date || '');
                    formData.append('dayOfWeek', editingReminder.value.dayOfWeek);
                    formData.append('dayOfMonth', editingReminder.value.dayOfMonth || '');
                    formData.append('monthDay', monthDay);
                    if (editingReminder.value.id) {
                        formData.append('id', editingReminder.value.id);
                    }
                    if (currentKbId.value) {
                        formData.append('kbId', currentKbId.value);
                    }
                    
                    const r = await checkAuthBeforeFetch(url, { method: 'POST', body: formData });
                    if (isAuthError(r)) { handleUnauthenticated(); return; }
                    if (r.ok) {
                        showReminderModal.value = false;
                        await loadReminders();
                    }
                }

                async function toggleReminder(id) {
                    let url = '/api/reminders/toggle?id=' + id;
                    if (currentKbId.value) url += '&kbId=' + currentKbId.value;
                    
                    const r = await checkAuthBeforeFetch(url, { method: 'POST' });
                    if (isAuthError(r)) { handleUnauthenticated(); return; }
                    if (r.ok) {
                        await loadReminders();
                    }
                }

                function openDeleteModal(id, type) {
                    deleteId.value = id;
                    deleteType.value = type;
                    showDeleteModal.value = true;
                }

                async function confirmDelete() {
                    let url = deleteType.value === 'reminder' 
                        ? '/api/reminders/delete' 
                        : '/api/reminders/delete';
                    url += '?id=' + deleteId.value;
                    if (currentKbId.value) url += '&kbId=' + currentKbId.value;
                    
                    const r = await checkAuthBeforeFetch(url, { method: 'POST' });
                    if (isAuthError(r)) { handleUnauthenticated(); return; }
                    if (r.ok) {
                        showDeleteModal.value = false;
                        await loadReminders();
                    }
                }

                function getScheduleText(reminder) {
                    const time = reminder.time || '09:00';
                    const type = reminder.type || 'daily';
                    
                    switch(type) {
                        case 'daily': return '每天 ' + time;
                        case 'once': return '一次 ' + (reminder.date || '') + ' ' + time;
                        case 'weekly': 
                            const days = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                            return '每周' + (days[parseInt(reminder.dayOfWeek) || 1]) + ' ' + time;
                        case 'monthly': return '每月' + (reminder.dayOfMonth || 1) + '号 ' + time;
                        case 'yearly': return '每年' + (reminder.monthDay || '1月1日') + ' ' + time;
                        default: return time;
                    }
                }

                function formatDate(dateStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    return (date.getMonth() + 1) + '/' + date.getDate();
                }

                onMounted(() => {
                    loadReminders();
                });

                return {
                    reminders,
                    showReminderModal, isEditingReminder, editingReminder,
                    reminderYearMonth, reminderYearDay,
                    showDeleteModal, deleteId, deleteType,
                    enabledReminderCount,
                    showAddReminderModal, showEditReminderModal, onReminderTypeChange, saveReminder,
                    toggleReminder, openDeleteModal, confirmDelete,
                    getScheduleText, formatDate
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
