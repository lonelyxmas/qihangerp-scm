<th:block th:fragment="sidebar(currentNav)">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span style="font-size:14px;">启航AI</span>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <nav class="nav-menu">
            <div class="sidebar-group-label">AI 工作台</div>
            <a href="/" class="nav-item" th:classappend="${currentNav == 'home' ? 'active' : ''}" title="首页">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>首页</span>
            </a>
            <a href="/chat" class="nav-item" th:classappend="${currentNav == 'chat' ? 'active' : ''}" title="AI 对话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>AI 对话</span>
            </a>

            <div class="sidebar-group-label">工作中心</div>
            <a href="/notes" class="nav-item" th:classappend="${currentNav == 'notes' ? 'active' : ''}" title="知识库">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>知识库</span>
            </a>
            <a href="/data" class="nav-item" th:classappend="${currentNav == 'data' ? 'active' : ''}" title="数据中心">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="12" y1="12" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="12" y2="12"/>
                </svg>
                <span>数据中心</span>
            </a>
            <a href="/planner" class="nav-item" th:classappend="${currentNav == 'planner' ? 'active' : ''}" title="任务看板">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>任务看板</span>
            </a>

            <div class="sidebar-group-label">协作中心</div>
            <a href="/activity" class="nav-item" th:classappend="${currentNav == 'activity' ? 'active' : ''}" title="动态流">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
                    <line x1="13" y1="19" x2="19" y2="13"/>
                    <line x1="16" y1="16" x2="20" y2="20"/>
                    <line x1="19" y1="21" x2="21" y2="19"/>
                </svg>
                <span>动态流</span>
            </a>
            <a href="/notifications" class="nav-item" th:classappend="${currentNav == 'notifications' ? 'active' : ''}" title="通知中心">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>通知中心</span>
            </a>
            <a href="/approvals" class="nav-item" th:classappend="${currentNav == 'approvals' ? 'active' : ''}" title="审批中心">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                <span>审批中心</span>
            </a>

            <div class="sidebar-group-label">工具箱</div>
            <a href="/image" class="nav-item" th:classappend="${currentNav == 'image' ? 'active' : ''}" title="图片识别/生成">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>图片工具</span>
            </a>
            <a href="/tools" class="nav-item" th:classappend="${currentNav == 'tools' ? 'active' : ''}" title="工具箱">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
                <span>工具箱</span>
            </a>
            <a href="/help" class="nav-item" th:classappend="${currentNav == 'help' ? 'active' : ''}" title="帮助">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                <span>帮助中心</span>
            </a>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="sidebar-footer" id="sidebarFooter">
            <div id="sidebarLoggedIn" th:styleappend="${isLoggedIn ? '' : 'display:none'}">
                <div style="padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin-bottom:4px;">
                    <div style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;">
                        <span id="sidebarUserAvatar">U</span>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div id="sidebarUserName" style="font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">用户</div>
                    </div>
                    <a href="#" style="font-size:11px;color:var(--text-muted);text-decoration:none;padding:2px 6px;border-radius:4px;border:1px solid var(--border);" onclick="event.preventDefault();logout();">退出</a>
                </div>
                <a href="/config" class="nav-item" th:classappend="${currentNav == 'config' ? 'active' : ''}" title="配置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>系统设置</span>
                </a>
                <a href="/admin/users" class="nav-item" th:classappend="${currentNav == 'admin' ? 'active' : ''}" title="用户管理">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>用户管理</span>
                </a>
                <a href="/log" class="nav-item" th:classappend="${currentNav == 'log' ? 'active' : ''}" title="日志">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="9"/>
                        <line x1="9" y1="13" x2="15" y2="13"/>
                        <line x1="9" y1="17" x2="13" y2="17"/>
                    </svg>
                    <span>操作日志</span>
                </a>
                <a href="/automation" class="nav-item" th:classappend="${currentNav == 'automation' ? 'active' : ''}" title="自动化">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
                        <line x1="13" y1="19" x2="19" y2="13"/>
                        <line x1="16" y1="16" x2="20" y2="20"/>
                        <line x1="19" y1="21" x2="21" y2="19"/>
                        <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
                        <line x1="5" y1="14" x2="9" y2="18"/>
                    </svg>
                    <span>自动规则</span>
                </a>
            </div>
            <div id="sidebarGuest" th:styleappend="${isGuest ? '' : 'display:none'}">
                <a href="#" class="nav-item" title="登录" onclick="showLoginModal();return false;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>登录 / 注册</span>
                </a>
            </div>
        </div>
    </aside>

    <script>
        function updateSidebar() {
            var token = localStorage.getItem('Admin-Token');
            if (token) {
                fetch('/api/sys-api/getInfo', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(function(r) { return r.json(); }).then(function(data) {
                    if (data.code === 200 || data.ok) {
                        var user = data.user || {};
                        var name = user.userName || user.nickName || '用户';
                        document.getElementById('sidebarLoggedIn').style.display = '';
                        document.getElementById('sidebarGuest').style.display = 'none';
                        document.getElementById('sidebarUserName').textContent = name;
                        document.getElementById('sidebarUserAvatar').textContent = name.charAt(0).toUpperCase();
                    }
                }).catch(function() {});
            }
        }
        function logout() {
            fetch('/api/sys-api/logout', { method: 'POST' }).then(function() {
                localStorage.removeItem('Admin-Token');
                document.cookie = 'Admin-Token=;path=/;max-age=0';
                document.getElementById('sidebarLoggedIn').style.display = 'none';
                document.getElementById('sidebarGuest').style.display = '';
            });
        }
        document.addEventListener('DOMContentLoaded', updateSidebar);
    </script>

    <th:block th:replace="3.0/fragments/login-modal::loginModal"></th:block>
</th:block>
