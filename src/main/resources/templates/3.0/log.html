<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启航 AI 协作平台 - 日志</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }

        .sidebar { width: 64px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; align-items: center; }
        .sidebar-header { padding: 0 8px 16px; }
        .sidebar-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-title svg { width: 24px; height: 24px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; cursor: pointer; color: var(--text-secondary); font-size: 11px; transition: all 0.2s; border-radius: var(--radius-md); text-decoration: none; width: 48px; }
        .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 16px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; flex-shrink: 0; background: white; gap: 12px; }
        .content-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .content-subtitle { font-size: 13px; color: var(--text-muted); }

        .content-body { flex: 1; overflow-y: auto; padding: 24px; background: #f5f5f5; }

        .card { background: white; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--text-secondary); font-weight: 500; white-space: nowrap; font-size: 12px; }
        td { color: var(--text-primary); line-height: 1.6; }
        tr:hover td { background: var(--hover); }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid; white-space: nowrap; }
        .badge-ok { background: #dcfce7; color: #166534; border-color: #86efac; }
        .badge-fail { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .badge-info { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }

        .text-muted { color: var(--text-muted); font-size: 13px; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>

    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">操作日志</h1>
            <span class="content-subtitle">最近 100 条操作记录</span>
        </div>

        <div class="content-body">
            <div class="card">
                <th:block th:if="${logs != null and #lists.size(logs) > 0}">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>操作</th>
                            <th>状态</th>
                            <th>详情</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td style="white-space:nowrap;" th:text="${log.time}">时间</td>
                            <td th:text="${log.action}">操作</td>
                            <td>
                                <span th:if="${log.status == '成功'}" class="badge badge-ok">✓ 成功</span>
                                <span th:if="${log.status == '失败'}" class="badge badge-fail">✗ 失败</span>
                                <span th:if="${log.status != '成功' and log.status != '失败'}" class="badge badge-info" th:text="'ℹ ' + ${log.status}">状态</span>
                            </td>
                            <td class="text-muted" th:text="${log.detail}">详情</td>
                        </tr>
                    </tbody>
                </table>
                </th:block>
                <th:block th:unless="${logs != null and #lists.size(logs) > 0}">
                <div class="text-muted" style="padding:12px 0;">暂无日志记录。</div>
                </th:block>
            </div>
        </div>
    </main>
</body>
</html>
