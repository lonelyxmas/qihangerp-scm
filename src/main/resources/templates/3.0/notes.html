<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔灵 AI - 笔记</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
            onload="window.__katexLoaded = true"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; }
        .sidebar-header { padding: 0 16px 16px; }
        .sidebar-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-title svg { width: 24px; height: 24px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; color: var(--text-secondary); font-size: 14px; transition: all 0.2s; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
        .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: white; }
        .content-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .content-body { flex: 1; overflow: hidden; display: flex; }

        /* Notes Container */
        .notes-container { display: flex; flex: 1; overflow: hidden; }

        /* File Tree */
        .file-tree { width: 320px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .tree-header { padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tree-header-row { display: flex; align-items: center; gap: 8px; }
        .tree-title { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; }
        .kb-select { padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; outline: none; background: white; color: var(--text-primary); cursor: pointer; }
        .kb-select:focus { border-color: var(--primary); }
        .refresh-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text-muted); padding: 2px; }
        .refresh-btn:hover { color: var(--primary); }

        .tree-body { flex: 1; overflow-y: auto; padding: 8px; }
        .tree-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; border-radius: var(--radius-sm); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tree-item:hover { background: var(--hover); }
        .tree-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
        .tree-item.folder { font-weight: 500; color: var(--text-primary); }
        .tree-item.file { color: var(--text-secondary); }
        .tree-arrow { font-size: 10px; width: 12px; text-align: center; flex-shrink: 0; color: var(--text-muted); }
        .tree-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
        .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .tree-children { padding-left: 12px; }
        .tree-children.collapsed { display: none; }

        .tree-empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 13px; }

        /* Note Preview */
        .note-preview { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); }
        .preview-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: white; flex-shrink: 0; }
        .preview-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .preview-path { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .preview-actions { display: flex; gap: 6px; }

        .preview-content { flex: 1; overflow-y: auto; padding: 32px 48px; font-size: 14px; line-height: 1.85; color: var(--text-primary); background: white; }
        .preview-content h1 { font-size: 28px; font-weight: 700; margin: 0 0 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
        .preview-content h2 { font-size: 22px; font-weight: 600; margin: 32px 0 16px; padding-left: 12px; border-left: 4px solid var(--primary); }
        .preview-content h3 { font-size: 18px; font-weight: 600; margin: 24px 0 12px; }
        .preview-content h4 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
        .preview-content p { margin-bottom: 16px; }
        .preview-content ul, .preview-content ol { padding-left: 28px; margin-bottom: 16px; }
        .preview-content li { margin-bottom: 4px; }
        .preview-content li::marker { color: var(--primary); }
        .preview-content code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; color: var(--primary-dark); }
        .preview-content pre { background: #1e293b; color: #e2e8f0; padding: 16px 20px; border-radius: var(--radius-sm); overflow-x: auto; margin: 16px 0; font-size: 13px; line-height: 1.6; }
        .preview-content pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
        .preview-content blockquote { border-left: 4px solid var(--primary); padding: 8px 16px; color: var(--text-secondary); margin: 16px 0; background: rgba(99, 102, 241, 0.04); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .preview-content blockquote p { margin: 0; }
        .preview-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
        .preview-content th { background: rgba(99, 102, 241, 0.08); color: var(--primary-dark); font-weight: 600; padding: 10px 12px; border: 1px solid var(--border); text-align: left; }
        .preview-content td { padding: 8px 12px; border: 1px solid var(--border); }
        .preview-content tr:nth-child(even) { background: #fafbfc; }
        .preview-content a { color: var(--primary); text-decoration: none; }
        .preview-content a:hover { text-decoration: underline; }
        .preview-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
        .preview-content img { max-width: 100%; border-radius: var(--radius-sm); margin: 12px 0; }
        .preview-content .katex-display { margin: 16px 0; }

        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.4; }
        .empty-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }
        .empty-desc { font-size: 14px; color: var(--text-muted); }

        /* No KB state */
        .no-kb-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .hidden { display: none !important; }
        .no-kb-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.4; }
        .no-kb-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }
        .no-kb-desc { font-size: 14px; color: var(--text-muted); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* KaTeX overrides */
        .katex { font-size: 1em; }
        .katex-display { overflow-x: auto; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                笔灵 AI
            </div>
        </div>
        <nav class="nav-menu">
            <div class="nav-item" onclick="window.location.href='/v3/chat'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                对话
            </div>
            <div class="nav-item" onclick="window.location.href='/v3/ai'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5-2 4-2 4 2 4 2"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/>
                </svg>
                AI 概览
            </div>
            <div class="nav-item active" onclick="window.location.href='/v3/notes'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                笔记
            </div>
            <div class="nav-item" onclick="window.location.href='/v3/data'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="12" y1="12" x2="12" y2="15"/><line x1="12" y1="9" x2="12" y2="12"/>
                </svg>
                数据
            </div>
            <div class="nav-item" onclick="window.location.href='/v3/planner'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                任务提醒
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">笔记</h1>
        </div>

        <!-- 无笔记库时 -->
        <div id="noKbState" class="no-kb-state hidden">
            <div class="no-kb-icon">📚</div>
            <div class="no-kb-title">暂无笔记库</div>
            <div class="no-kb-desc">请先在配置页添加笔记库</div>
        </div>

        <!-- 笔记内容区 -->
        <div id="notesArea" class="content-body hidden">
            <div class="notes-container">
                <!-- 左侧文件树 -->
                <div class="file-tree">
                    <div class="tree-header">
                        <div class="tree-header-row">
                            <select id="kbSelect" class="kb-select" onchange="onKbChange(this.value)">
                                <option value="">加载中...</option>
                            </select>
                            <button class="refresh-btn" onclick="refreshTree()" title="刷新">🔄</button>
                        </div>
                        <div class="preview-path" id="kbPath" style="margin-top:6px;"></div>
                    </div>
                    <div id="fileTree" class="tree-body">
                        <div class="tree-empty">加载中...</div>
                    </div>
                </div>

                <!-- 右侧文件预览 -->
                <div class="note-preview">
                    <div class="preview-header">
                        <div>
                            <div class="preview-title" id="previewTitle">选择文件查看</div>
                            <div class="preview-path" id="previewPath"></div>
                        </div>
                        <div class="preview-actions">
                            <button class="refresh-btn" onclick="refreshCurrentNote()" title="刷新内容">🔄</button>
                        </div>
                    </div>
                    <div class="preview-content" id="previewContent">
                        <div class="empty-state">
                            <div class="empty-icon">📄</div>
                            <div class="empty-title">选择笔记文件</div>
                            <div class="empty-desc">在左侧文件树中选择一个 Markdown 文件查看内容</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
    var currentKbId = null;
    var currentKbList = [];
    var currentFilePath = null;

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', function() {
        // 使用服务端渲染的笔记库列表
        var kbList = /*[[${kbList}]]*/ [];
        if (kbList && kbList.length > 0) {
            currentKbList = kbList.map(function(kb) {
                return { id: kb.id, name: kb.name, notesDir: kb.notesDir };
            });
        }
        initPage();
    });

    function initPage() {
        if (currentKbList && currentKbList.length > 0) {
            renderKbSelect();
            // 默认选中第一个
            currentKbId = currentKbList[0].id;
            document.getElementById('kbSelect').value = currentKbId;
            // 显示笔记区域
            document.getElementById('notesArea').classList.remove('hidden');
            document.getElementById('noKbState').classList.add('hidden');
            onKbChange(currentKbId);
        } else {
            // 尝试从 API 获取
            loadKbListFromApi();
        }
    }

    async function loadKbListFromApi() {
        try {
            var r = await fetch('/v3/api/kbs');
            var d = await r.json();
            if (d.ok && d.data && d.data.length > 0) {
                currentKbList = d.data;
                initPage();
            } else {
                document.getElementById('noKbState').classList.remove('hidden');
                document.getElementById('notesArea').classList.add('hidden');
            }
        } catch(e) {
            document.getElementById('noKbState').classList.remove('hidden');
            document.getElementById('notesArea').classList.add('hidden');
        }
    }

    function renderKbSelect() {
        var sel = document.getElementById('kbSelect');
        sel.innerHTML = currentKbList.map(function(kb) {
            return '<option value="' + kb.id + '">' + escapeHtml(kb.name) + '</option>';
        }).join('');
    }

    // ========== 切换笔记库 ==========
    function onKbChange(kbId) {
        if (!kbId) return;
        currentKbId = parseInt(kbId);
        var kb = currentKbList.find(function(k) { return k.id === currentKbId; });
        if (kb) {
            document.getElementById('kbPath').textContent = kb.notesDir || '';
        }
        // 清空预览
        document.getElementById('previewTitle').textContent = '选择文件查看';
        document.getElementById('previewPath').textContent = '';
        document.getElementById('previewContent').innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-title">选择笔记文件</div><div class="empty-desc">在左侧文件树中选择一个 Markdown 文件查看内容</div></div>';
        currentFilePath = null;
        loadFileTree();
    }

    // ========== 文件树 ==========
    async function loadFileTree() {
        if (!currentKbId) return;
        var tree = document.getElementById('fileTree');
        tree.innerHTML = '<div class="tree-empty">加载中...</div>';

        try {
            var r = await fetch('/v3/api/notes/tree?kbId=' + currentKbId);
            var d = await r.json();
            if (d.ok && d.tree) {
                renderTree(d.tree, tree);
            } else {
                tree.innerHTML = '<div class="tree-empty">暂无文件</div>';
            }
        } catch(e) {
            tree.innerHTML = '<div class="tree-empty">加载失败: ' + e.message + '</div>';
        }
    }

    function renderTree(tree, container) {
        container.innerHTML = '';
        if (!tree) return;

        function hasContent(node) {
            var dirs = node.dirs || [];
            var files = node.files || [];
            return dirs.length > 0 || files.length > 0;
        }

        function renderNode(node, parentEl, indent) {
            if (node.dirs) {
                node.dirs.forEach(function(dir) {
                    var children = dir.children || {};
                    var hasChildren = hasContent(children);

                    var folderEl = document.createElement('div');
                    folderEl.className = 'tree-item folder';
                    if (indent > 0) folderEl.style.paddingLeft = (indent * 12) + 'px';

                    var arrowHtml = hasChildren
                        ? '<span class="tree-arrow">▶</span>'
                        : '<span class="tree-arrow" style="visibility:hidden;">▶</span>';
                    var folderIcon = hasChildren ? '📂' : '📁';

                    folderEl.innerHTML =
                        arrowHtml +
                        '<span class="tree-icon">' + folderIcon + '</span>' +
                        '<span class="tree-name">' + escapeHtml(dir.name) + '</span>';

                    if (hasChildren) {
                        folderEl.onclick = function(e) {
                            e.stopPropagation();
                            var childrenEl = folderEl.nextElementSibling;
                            if (childrenEl) {
                                childrenEl.classList.toggle('collapsed');
                                var isCollapsed = childrenEl.classList.contains('collapsed');
                                folderEl.querySelector('.tree-arrow').textContent = isCollapsed ? '▶' : '▼';
                                folderEl.querySelector('.tree-icon').textContent = isCollapsed ? '📁' : '📂';
                            }
                        };
                    }

                    parentEl.appendChild(folderEl);

                    var childContainer = document.createElement('div');
                    childContainer.className = 'tree-children collapsed';
                    parentEl.appendChild(childContainer);

                    renderNode(children, childContainer, indent + 1);
                });
            }

            if (node.files) {
                node.files.forEach(function(file) {
                    var fileEl = document.createElement('div');
                    fileEl.className = 'tree-item file';
                    if (indent > 0) fileEl.style.paddingLeft = (indent * 12) + 'px';
                    fileEl.innerHTML = '<span class="tree-icon">📄</span><span class="tree-name">' + escapeHtml(file.name) + '</span>';
                    fileEl.onclick = function(e) {
                        e.stopPropagation();
                        document.querySelectorAll('.tree-item.file').forEach(function(el) {
                            el.classList.remove('active');
                        });
                        fileEl.classList.add('active');
                        loadNote(file.path);
                    };
                    parentEl.appendChild(fileEl);
                });
            }
        }

        renderNode(tree, container, 0);
    }

    function refreshTree() {
        loadFileTree();
    }

    // ========== 笔记内容 ==========
    async function loadNote(path) {
        if (!currentKbId || !path) return;
        currentFilePath = path;

        var titleEl = document.getElementById('previewTitle');
        var pathEl = document.getElementById('previewPath');
        var contentEl = document.getElementById('previewContent');

        titleEl.textContent = '加载中...';
        pathEl.textContent = path;
        contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">加载中...</div></div>';

        try {
            var r = await fetch('/v3/api/notes/read?kbId=' + currentKbId + '&path=' + encodeURIComponent(path));
            var d = await r.json();
            if (d.ok && d.content) {
                var fileName = path.split('/').pop().replace('.md', '');
                titleEl.textContent = fileName;
                pathEl.textContent = path;
                contentEl.innerHTML = parseMarkdown(d.content);
                // 渲染公式
                renderMath(contentEl);
            } else {
                contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">读取失败</div><div class="empty-desc">' + (d.error || '未知错误') + '</div></div>';
            }
        } catch(e) {
            contentEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">读取失败</div><div class="empty-desc">' + e.message + '</div></div>';
        }
    }

    function refreshCurrentNote() {
        if (currentFilePath) {
            loadNote(currentFilePath);
        }
    }

    // ========== Markdown 解析 ==========
    function parseMarkdown(text) {
        if (!text) return '';
        try {
            return marked.parse(text);
        } catch (e) {
            return '<pre>' + escapeHtml(text) + '</pre>';
        }
    }

    // ========== 公式渲染 ==========
    function renderMath(el) {
        if (!el) return;
        // KaTeX 可能还在加载，等待
        if (window.__katexLoaded || typeof renderMathInElement !== 'undefined') {
            try {
                renderMathInElement(el, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            } catch(e) {
                console.debug('KaTeX 渲染失败:', e);
            }
        } else {
            // 延迟重试
            setTimeout(function() { renderMath(el); }, 500);
        }
    }

    // ========== 工具函数 ==========
    function escapeHtml(text) {
        if (!text) return '';
        var d = document.createElement('div');
        d.textContent = String(text);
        return d.innerHTML;
    }
    </script>
</body>
</html>
