<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css">
    <title>启航 AI 协作平台 - 全局搜索</title>
    <style>
        .search-box { display: flex; gap: 8px; max-width: 600px; margin: 0 auto 20px; }
        .search-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .search-results { padding: 12px 0; }
        .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .results-count { font-size: 13px; color: var(--text-muted); }
        .kb-group { margin-bottom: 20px; }
        .kb-group-header { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .kb-group-header::before { content: ""; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
        .kb-group-header .kb-count { color: var(--text-muted); font-weight: 400; font-size: 12px; }
        .search-item { padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: white; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; }
        .search-item:hover { background: var(--hover); border-color: var(--primary); }
        .search-item-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .kb-badge { font-size: 11px; padding: 1px 6px; background: rgba(99,102,241,0.1); color: var(--primary); border-radius: 4px; flex-shrink: 0; }
        .search-item-path { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .search-item-preview { font-size: 12px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .search-score { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 32px; color: var(--text-secondary); }
        .loading-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: loading 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loading { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>

    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">全局搜索</h1>
        </div>

        <div class="content-body">
            <div class="card">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索所有知识库..." onkeyup="if(event.keyCode===13)doSearch()">
                    <button class="btn btn-primary" onclick="doSearch()">搜索</button>
                </div>

                <div id="resultsSection"></div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = '/api/ai';

        function handleUnauthenticated() {
            localStorage.removeItem('Admin-Token');
            document.cookie = 'Admin-Token=; path=/; max-age=0; SameSite=Lax';
            document.getElementById('searchInput').disabled = true;
            document.getElementById('resultsSection').innerHTML = '<div class="empty-state"><div class="empty-icon">🔐</div><div class="empty-title">需要登录</div><div class="empty-desc">登录后即可搜索所有知识库</div></div>';
            showLoginModal(function() { window.location.href = window.location.href; });
        }

        function apiFetch(url, options) {
            if (!options) options = {};
            if (!options.headers) options.headers = {};
            var token = localStorage.getItem('Admin-Token');
            if (token) options.headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, options);
        }

        function checkAuthBeforeFetch(url, opts) {
            return apiFetch(url, opts).then(function(r) {
                if (r.status === 401 || r.status === 403) return r.json().then(function(d) { d.__401 = true; return d; });
                if (!r.ok) throw new Error('请求失败');
                return r.json();
            });
        }

        function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;

            const section = document.getElementById('resultsSection');
            section.innerHTML = '<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>搜索中...</div>';

            checkAuthBeforeFetch(API_BASE + '/global-search?query=' + encodeURIComponent(q) + '&limit=15')
                .then(d => {
                    if (d && d.__401) { handleUnauthenticated(); return; }
                    if (d.code === 500 && d.msg === '认证失败') { handleUnauthenticated(); return; }
                    if (!d.ok) {
                        if (d.error === '请先登录') { handleUnauthenticated(); return; }
                        section.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">搜索失败</div><div class="empty-desc">' + escapeHtml(d.error || '未知错误') + '</div></div>';
                        return;
                    }
                    if (d.results && d.results.length > 0) {
                        section.innerHTML = '<div class="search-results">' + renderResults(d.results) + '</div>';
                    } else {
                        section.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">未找到相关笔记</div><div class="empty-desc">尝试使用其他关键词搜索</div></div>';
                    }
                })
                .catch(e => {
                    console.error('搜索失败', e);
                    section.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">搜索失败</div><div class="empty-desc">请稍后重试</div></div>';
                });
        }

        function renderResults(results) {
            const groups = {};
            results.forEach(r => {
                if (!groups[r.kbId]) groups[r.kbId] = [];
                groups[r.kbId].push(r);
            });

            let html = '<div class="results-header"><span>搜索结果</span><span class="results-count">共 ' + results.length + ' 条</span></div>';

            for (const [, items] of Object.entries(groups)) {
                const kbName = items[0].kbName || '未知知识库';
                html += '<div class="kb-group"><div class="kb-group-header">' + escapeHtml(kbName) + ' <span class="kb-count">(' + items.length + ' 条)</span></div>';
                items.forEach(item => {
                    html += '<div class="search-item">' +
                        '<div class="search-item-title"><span class="kb-badge">' + escapeHtml(kbName) + '</span>' + escapeHtml(item.filePath) + '</div>' +
                        '<div class="search-item-path">' + escapeHtml(item.pathContext || '') + '</div>' +
                        '<div class="search-item-preview">' + escapeHtml(item.content || '') + '</div>' +
                        '<div class="search-score">匹配度: ' + (item.score * 100).toFixed(0) + '%</div>' +
                        '</div>';
                });
                html += '</div>';
            }
            return html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', function() {
            var token = localStorage.getItem('Admin-Token');
            if (!token) {
                handleUnauthenticated();
                return;
            }
            fetch('/api/sys-api/getInfo', { credentials: 'same-origin' }).then(function(r) {
                if (r.status === 401 || r.status === 403) {
                    handleUnauthenticated();
                }
            }).catch(function() {});
        });

        document.addEventListener('auth-change', function() {
            var token = localStorage.getItem('Admin-Token');
            if (!token) {
                handleUnauthenticated();
            }
        });
    </script>
</body>
</html>
