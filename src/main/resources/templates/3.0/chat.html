<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css">
    <title>启航 AI 协作平台 - 对话</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
            onload="window.__katexLoaded = true"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <style>
        .sessions-sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sessions-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .sessions-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .new-chat-btn { width: 100%; padding: 8px 12px; border: none; background: var(--primary); color: white; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; transition: all 0.2s; }
        .new-chat-btn:hover { background: var(--primary-dark); }
        .sessions-container { flex: 1; overflow-y: auto; padding: 8px 0; }
        .session-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all 0.2s; border-radius: var(--radius-sm); margin: 0 4px; }
        .session-item:hover { background: var(--hover); color: var(--text-primary); }
        .session-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .session-item .delete-btn { margin-left: auto; opacity: 0; color: var(--text-muted); transition: all 0.2s; }
        .session-item:hover .delete-btn { opacity: 1; }
        .session-item .delete-btn:hover { color: #ef4444; }
        
        .content-actions { display: flex; gap: 8px; }
        
        .chat-wrapper { width: 100%; max-width: 1000px; display: flex; flex-direction: column; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
        
        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--hover); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        .chat-container { height: 100%; display: flex; flex-direction: column; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #ffffff; }
        
        .message { display: flex; gap: 12px; max-width: 100%; animation: fadeIn 0.2s ease-out; margin-bottom: 8px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .message.user .message-avatar { background: #5c5c5c; color: white; }
        .message.assistant .message-avatar { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; }
        .message-content-wrapper { display: flex; flex-direction: column; gap: 6px; max-width: 75%; }
        .message-header { display: flex; align-items: center; gap: 8px; }
        .message-author { font-size: 13px; font-weight: 500; }
        .message.user .message-author { color: #64748b; }
        .message.assistant .message-author { color: #6366f1; }
        .message-content { padding: 14px 18px; border-radius: 16px; line-height: 1.7; font-size: 14px; word-wrap: break-word; }
        .message.user .message-content { background: #f1f5f9; color: #1e293b; }
        .message.assistant .message-content { background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; }
        .message-time { font-size: 11px; color: #94a3b8; }
        .message.user .message-time { text-align: right; }
        
        .status-area { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(99, 102, 241, 0.08); color: #6366f1; border-radius: 12px; font-size: 12px; margin-bottom: 8px; border: 1px solid rgba(99, 102, 241, 0.15); width: fit-content; }
        
        .mention-tag { display: inline-block; padding: 1px 6px; background: rgba(99, 102, 241, 0.1); color: #6366f1; font-size: 12px; border-radius: 4px; margin-right: 4px; }
        
        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 14px 18px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; }
        .typing-dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        
        .chat-input-area { padding: 12px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; flex-shrink: 0; }
        .input-wrapper { background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; }
        .chat-input { width: 100%; padding: 12px 16px; border: none; background: transparent; font-size: 14px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.5; }
        .chat-input::placeholder { color: #94a3b8; }
        
        .input-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid #f1f5f9; }
        .input-left { display: flex; align-items: center; gap: 8px; }
        .input-right { display: flex; align-items: center; gap: 4px; }
        
        .footer-btn { padding: 6px 12px; border: none; background: transparent; color: #64748b; border-radius: 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .footer-btn:hover { background: #f1f5f9; color: #1e293b; }
        .footer-btn.active { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
        
        .send-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; background: #6366f1; color: white; transition: all 0.2s; border: none; }
        .send-btn:hover { background: #4f46e5; }
        .send-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .divider { width: 1px; height: 16px; background: #e2e8f0; }
        
        .dropdown-menu { position: fixed; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 8px; width: 200px; max-height: 250px; overflow-y: auto; display: none; z-index: 9999; }
        .dropdown-item { padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .dropdown-item:hover { background: var(--hover); }
        .dropdown-item.selected { background: rgba(99, 102, 241, 0.08); color: #6366f1; }
        .dropdown-item-icon { width: 24px; height: 24px; background: rgba(99, 102, 241, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 12px; }
        
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
        .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
        .empty-desc { font-size: 14px; line-height: 1.6; color: #64748b; }
        
        .markdown-content { white-space: pre-wrap; word-break: break-word; }
        .markdown-content p { margin-bottom: 8px; }
        .markdown-content ul, .markdown-content ol { padding-left: 20px; margin-bottom: 8px; }
        .markdown-content li { margin-bottom: 4px; }
        .markdown-content code { background: rgba(0,0,0,0.04); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .markdown-content pre { background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 8px; font-family: monospace; font-size: 13px; }
        .markdown-content blockquote { border-left: 3px solid #6366f1; padding-left: 10px; color: #64748b; margin-bottom: 8px; }
        .markdown-content strong { font-weight: 600; }
        .markdown-content a { color: #6366f1; text-decoration: none; }
        .markdown-content a:hover { text-decoration: underline; }
        
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>
    
    <aside class="sessions-sidebar">
        <div class="sessions-header">
            <div class="sessions-title">对话</div>
            <button class="new-chat-btn" onclick="createNewSession()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                新对话
            </button>
        </div>
        <div class="sessions-container" id="sessionsList"></div>
    </aside>
    
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title" id="chatTitle">对话</h1>
            <div class="content-actions">
                <button class="btn btn-secondary btn-sm" onclick="clearCurrentSession()">清空</button>
            </div>
        </div>
        
        <div class="content-body">
            <div class="chat-wrapper">
                <div id="chatMessages" class="chat-messages">
                    <div id="emptyState" class="empty-state">
                        <div class="empty-icon">💬</div>
                        <div class="empty-title">开始对话</div>
                        <div class="empty-desc">你可以直接与 AI 对话，或使用 @笔记库名 进行知识库问答。</div>
                    </div>
                    <div id="messagesList"></div>
                </div>
                
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="chatInput" class="chat-input" placeholder="有问题尽管问"
                                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"
                                  oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
                        
                        <div class="input-footer">
                            <div class="input-left">
                                <button class="footer-btn" onclick="toggleMentionDropdown()">
                                    <span>@</span>
                                </button>
                                <div class="divider"></div>
                                <button class="footer-btn" onclick="toggleModelDropdown()">
                                    <span id="currentModel">默认模型</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                                        <path d="M6 9l6 6 6-6"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="input-right">
                                <button id="sendBtn" class="send-btn" onclick="sendChat()">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <line x1="22" y1="2" x2="11" y2="13"/>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="mentionDropdown" class="dropdown-menu"></div>
                    <div id="modelDropdown" class="dropdown-menu"></div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        const API = '/api/chat';
        var currentSessionId = null;
        var sessions = [];
        var kbList = [];
        var modelList = [];
        var currentModel = '';
        
        document.addEventListener('DOMContentLoaded', function() {
            loadSessions();
            loadKbs();
            loadModels();
        });
        
        async function loadSessions() {
            const r = await fetch(API + '/sessions');
            const d = await r.json();
            if (d.ok && d.data) {
                sessions = d.data;
                renderSessions();
                if (sessions.length > 0) {
                    selectSession(sessions[0].id);
                }
            }
        }
        
        async function loadKbs() {
            const r = await fetch(API + '/kbs');
            const d = await r.json();
            if (d.ok && d.data) {
                kbList = d.data;
                renderMentionDropdown();
            }
        }
        
        async function loadModels() {
            const r = await fetch(API + '/models');
            const d = await r.json();
            if (d.ok && d.data) {
                modelList = d.data;
                currentModel = d.defaultModel || '';
                document.getElementById('currentModel').textContent = currentModel || '默认模型';
                renderModelDropdown();
            }
        }
        
        function renderSessions() {
            const container = document.getElementById('sessionsList');
            container.innerHTML = '';
            sessions.forEach(function(session) {
                const div = document.createElement('div');
                div.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
                div.setAttribute('data-id', session.id);
                div.onclick = function(e) {
                    if (!e.target.closest('.delete-btn')) {
                        selectSession(session.id);
                    }
                };
                div.innerHTML = `
                    <span>💬</span>
                    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${session.title}</span>
                    <button class="delete-btn" onclick="deleteSession('${session.id}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                            <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                    </button>
                `;
                container.appendChild(div);
            });
        }
        
        async function createNewSession() {
            const r = await fetch(API + '/sessions', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: ''
            });
            const d = await r.json();
            if (d.ok) {
                await loadSessions();
                selectSession(d.id);
            }
        }
        
        async function deleteSession(sessionId) {
            if (!confirm('确定要删除这个对话吗？')) return;
            const r = await fetch(API + '/sessions/' + sessionId, { method: 'DELETE' });
            const d = await r.json();
            if (d.ok) {
                await loadSessions();
                if (currentSessionId === sessionId) {
                    if (sessions.length > 0) {
                        selectSession(sessions[0].id);
                    } else {
                        currentSessionId = null;
                        document.getElementById('messagesList').innerHTML = '';
                        document.getElementById('emptyState').style.display = 'flex';
                        document.getElementById('chatTitle').textContent = '对话';
                    }
                }
            }
        }
        
        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            renderSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (session) {
                document.getElementById('chatTitle').textContent = session.title;
            }
            document.getElementById('emptyState').style.display = 'none';
            await loadMessages();
        }
        
        function renderMentionDropdown() {
            const dropdown = document.getElementById('mentionDropdown');
            dropdown.innerHTML = '';
            for (let i = 0; i < kbList.length; i++) {
                const kb = kbList[i];
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.setAttribute('data-name', kb.name);
                div.setAttribute('data-kb-id', kb.id);
                div.onclick = function() { insertMention(this.getAttribute('data-name')); };
                div.innerHTML = '<div class="dropdown-item-icon">📚</div><span>' + kb.name + '</span>';
                dropdown.appendChild(div);
            }
        }
        
        function renderModelDropdown() {
            const dropdown = document.getElementById('modelDropdown');
            dropdown.innerHTML = '';
            for (let i = 0; i < modelList.length; i++) {
                const model = modelList[i];
                const div = document.createElement('div');
                div.className = 'dropdown-item' + (model.name === currentModel ? ' selected' : '');
                div.setAttribute('data-model', model.name);
                div.onclick = function() { selectModel(this.getAttribute('data-model')); };
                div.innerHTML = '<span>' + model.name + '</span>';
                dropdown.appendChild(div);
            }
        }
        
        function toggleModelDropdown() {
            var dropdown = document.getElementById('modelDropdown');
            var btn = document.querySelectorAll('.footer-btn')[1];
            if (!btn) return;
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'block';
                var rect = btn.getBoundingClientRect();
                var dropdownHeight = dropdown.offsetHeight;
                dropdown.style.left = rect.left + 'px';
                dropdown.style.top = (rect.top - dropdownHeight - 4) + 'px';
            } else {
                dropdown.style.display = 'none';
            }
            document.getElementById('mentionDropdown').style.display = 'none';
        }
        
        function selectModel(modelName) {
            currentModel = modelName;
            document.getElementById('currentModel').textContent = modelName;
            document.getElementById('modelDropdown').style.display = 'none';
        }
        
        function toggleMentionDropdown() {
            var dropdown = document.getElementById('mentionDropdown');
            var btn = document.querySelectorAll('.footer-btn')[0];
            if (!btn) return;
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'block';
                var rect = btn.getBoundingClientRect();
                var dropdownHeight = dropdown.offsetHeight;
                dropdown.style.left = rect.left + 'px';
                dropdown.style.top = (rect.top - dropdownHeight - 4) + 'px';
            } else {
                dropdown.style.display = 'none';
            }
            document.getElementById('modelDropdown').style.display = 'none';
        }
        
        function insertMention(name) {
            var input = document.getElementById('chatInput');
            var start = input.selectionStart;
            var end = input.selectionEnd;
            var value = input.value;
            input.value = value.substring(0, start) + '@' + name + ' ' + value.substring(end);
            input.focus();
            document.getElementById('mentionDropdown').style.display = 'none';
        }
        
        async function loadMessages() {
            if (!currentSessionId) return;
            var r = await fetch(API + '/messages?sessionId=' + currentSessionId);
            var d = await r.json();
            if (d.ok && d.messages) {
                renderMessages(d.messages);
            }
        }
        
        function renderMessages(messages) {
            var container = document.getElementById('messagesList');
            container.innerHTML = '';
            messages.forEach(function(msg) {
                addMessage(msg.role, msg.content, msg.time);
            });
            scrollToBottom();
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return '';
            var date = new Date(timeStr);
            var now = new Date();
            var diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            var month = date.getMonth() + 1;
            var day = date.getDate();
            var hour = date.getHours().toString().padStart(2, '0');
            var minute = date.getMinutes().toString().padStart(2, '0');
            return month + '月' + day + '日 ' + hour + ':' + minute;
        }
        
        function parseMarkdown(text) {
            if (!text) return '';
            try {
                return marked.parse(text);
            } catch (e) {
                return text.replace(/\n/g, '<br>');
            }
        }
        
        function renderMath(el) {
            if (window.__katexLoaded || typeof renderMathInElement !== 'undefined') {
                try {
                    renderMathInElement(el, {
                        delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
                        throwOnError: false
                    });
                } catch(e) {}
            }
        }
        
        function highlightMentions(text) {
            return text.replace(/@(\S+)/g, '<span class="mention-tag">@$1</span>');
        }
        
        function addMessage(role, content, time) {
            var container = document.getElementById('messagesList');
            var div = document.createElement('div');
            div.className = 'message ' + role;
            var avatar = role === 'user' ? '👤' : '🤖';
            var author = role === 'user' ? '我' : '启航 AI 协作平台';
            var timeStr = time ? formatTime(time) : '';
            var displayContent = role === 'user' ? highlightMentions(content) : parseMarkdown(content);
            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content-wrapper">
                    <div class="message-header">
                        <span class="message-author">${author}</span>
                        ${timeStr ? '<span class="message-time">' + timeStr + '</span>' : ''}
                    </div>
                    <div class="message-content ${role === 'assistant' ? 'markdown-content' : ''}">${displayContent}</div>
                </div>
            `;
            container.appendChild(div);
            if (role === 'assistant') {
                renderMath(div.querySelector('.message-content'));
            }
            scrollToBottom();
        }
        
        function scrollToBottom() {
            var container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }
        
        function sendChat() {
            var input = document.getElementById('chatInput');
            var message = input.value.trim();
            if (!message) return;
            addMessage('user', message, new Date().toISOString());
            input.value = '';
            input.style.height = 'auto';
            
            var sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            addTypingIndicator();
            
            var mentionedKbId = parseMentionedKb(message);
            var formData = new FormData();
            formData.append('message', message);
            if (mentionedKbId) formData.append('kbId', mentionedKbId);
            formData.append('modelName', currentModel);
            if (currentSessionId) formData.append('sessionId', currentSessionId);
            
            fetch(API + '/send', { method: 'POST', body: formData })
                .then(function(response) {
                    if (!response.ok) throw new Error('Network response was not ok');
                    var reader = response.body.getReader();
                    var decoder = new TextDecoder();
                    var replyContent = '';
                    var replyDiv = null;
                    
                    function readChunk() {
                        reader.read().then(function(result) {
                            if (result.done) {
                                sendBtn.disabled = false;
                                removeTypingIndicator();
                                scrollToBottom();
                                return;
                            }
                            var chunk = decoder.decode(result.value, { stream: true });
                            var lines = chunk.split('\n');
                            lines.forEach(function(line) {
                                if (!line.trim()) return;
                                if (line.startsWith('data:')) line = line.substring(5).trim();
                                try {
                                    var data = JSON.parse(line);
                                    if (data.type === 'session') {
                                        if (!currentSessionId) {
                                            currentSessionId = data.sessionId;
                                            loadSessions();
                                        }
                                    } else if (data.type === 'text') {
                                        removeTypingIndicator();
                                        if (!replyDiv) {
                                            replyDiv = document.createElement('div');
                                            replyDiv.className = 'message assistant';
                                            replyDiv.innerHTML = `
                                                <div class="message-avatar">🤖</div>
                                                <div class="message-content-wrapper">
                                                    <div class="message-header"><span class="message-author">启航 AI 协作平台</span></div>
                                                    <div class="message-content markdown-content"></div>
                                                </div>
                                            `;
                                            document.getElementById('messagesList').appendChild(replyDiv);
                                        }
                                        replyContent += data.content;
                                        var contentEl = replyDiv.querySelector('.message-content');
                                        contentEl.innerHTML = parseMarkdown(replyContent);
                                        renderMath(contentEl);
                                        scrollToBottom();
                                    } else if (data.type === 'status') {
                                        updateStatusInReply(data.content);
                                    } else if (data.type === 'done') {
                                        sendBtn.disabled = false;
                                        scrollToBottom();
                                        loadSessions();
                                    } else if (data.type === 'error') {
                                        removeTypingIndicator();
                                        addMessage('assistant', '❌ ' + data.content, new Date().toISOString());
                                        sendBtn.disabled = false;
                                    }
                                } catch (err) {
                                    console.warn('Parse error:', err, line);
                                }
                            });
                            readChunk();
                        }).catch(function(err) {
                            console.error('Read error:', err);
                            sendBtn.disabled = false;
                            removeTypingIndicator();
                        });
                    }
                    readChunk();
                }).catch(function(err) {
                    console.error('Fetch error:', err);
                    sendBtn.disabled = false;
                    removeTypingIndicator();
                    addMessage('assistant', '❌ 发送失败: ' + err.message, new Date().toISOString());
                });
        }
        
        function addTypingIndicator() {
            var container = document.getElementById('messagesList');
            var div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content-wrapper">
                    <div class="message-header"><span class="message-author">启航 AI 协作平台</span></div>
                    <div class="message-content"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }
        
        function removeTypingIndicator() {
            var el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }
        
        function updateStatusInReply(text) {
            var typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                var contentWrapper = typingIndicator.querySelector('.message-content-wrapper');
                if (contentWrapper) {
                    var existingStatus = contentWrapper.querySelector('.status-area');
                    if (existingStatus) {
                        existingStatus.textContent = text;
                    } else {
                        var statusArea = document.createElement('div');
                        statusArea.className = 'status-area';
                        statusArea.textContent = text;
                        var messageContent = contentWrapper.querySelector('.message-content');
                        contentWrapper.insertBefore(statusArea, messageContent);
                    }
                }
            }
        }
        
        function clearCurrentSession() {
            if (!currentSessionId) {
                alert('请先选择一个对话');
                return;
            }
            if (!confirm('确定要清空当前对话记录吗？')) return;
            fetch(API + '/clear?sessionId=' + currentSessionId, { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.ok) {
                        document.getElementById('messagesList').innerHTML = '';
                    }
                });
        }
        
        function parseMentionedKb(message) {
            var match = message.match(/@(\S+)/);
            if (match) {
                var kbName = match[1];
                for (var i = 0; i < kbList.length; i++) {
                    if (kbList[i].name === kbName || kbList[i].name.includes(kbName)) {
                        return kbList[i].id;
                    }
                }
            }
            return null;
        }
        
        document.addEventListener('click', function(e) {
            var target = e.target;
            var isFooterBtn = target.classList.contains('footer-btn') || target.closest('.footer-btn');
            var isMentionDropdown = target.closest('#mentionDropdown');
            var isModelDropdown = target.closest('#modelDropdown');
            if (!isFooterBtn && !isMentionDropdown) {
                document.getElementById('mentionDropdown').style.display = 'none';
            }
            if (!isFooterBtn && !isModelDropdown) {
                document.getElementById('modelDropdown').style.display = 'none';
            }
        });
    </script>
</body>
</html>
