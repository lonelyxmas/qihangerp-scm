<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/app.css">
    <title th:text="'启航 AI 协作平台 - ' + (${selectedModuleId != null} ? '数据模块' : '数据中心')">启航 AI 协作平台 - 数据中心</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .module-sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .module-sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .module-sidebar-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .module-sidebar-list { flex: 1; overflow-y: auto; padding: 4px 0; }
        .module-item { display: flex; align-items: center; gap: 4px; padding: 4px 12px; cursor: pointer; color: #a0a0a0; font-size: 12px; transition: all 0.2s; border-radius: var(--radius-sm); margin: 0 4px; }
        .module-item:hover { background: var(--hover); color: #888; }
        .ds-sub-item { display: flex; align-items: center; gap: 6px; padding: 8px 12px 8px 44px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 500; transition: all 0.2s; border-radius: 0; margin: 0; border-bottom: 1px solid var(--border); }
        .ds-sub-item:hover { background: var(--hover); }
        .ds-sub-item.active { background: rgba(99, 102, 241, 0.08); color: var(--primary); font-weight: 600; border-bottom-color: transparent; }
        .ds-sub-item .ds-count { font-size: 11px; color: var(--text-muted); margin-left: auto; font-weight: 400; }

        .detail-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .detail-panel .content-body { flex: 1; overflow-y: auto; padding: 24px; }

        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-gray { background: #f5f5f7; color: #909296; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state .title { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }

        .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .ds-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: all 0.2s; }
        .ds-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .ds-card-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .ds-card-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .ds-card-bottom { display: flex; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
        .ds-card-stat strong { color: var(--primary); font-size: 14px; }

        .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }

        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary { background: white; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--hover); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-secondary); }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .data-table tr:hover { background: var(--hover); }
        .data-table .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text-muted); padding: 2px 6px; }
        .data-table .action-btn:hover { color: var(--primary); }

        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .detail-row .value { font-size: 13px; color: var(--text-primary); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-header h3 { font-size: 16px; font-weight: 600; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

        .msg { padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 8px; position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .msg-success { background: #dcfce7; color: #166534; }
        .msg-error { background: #fee2e2; color: #991b1b; }
        .msg-info { background: #dbeafe; color: #1e40af; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; background: white; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>

    <aside class="module-sidebar">
        <div class="module-sidebar-header">
            <div class="module-sidebar-title">数据集</div>
        </div>
        <div class="module-sidebar-list" id="moduleList">
            <div class="empty-state" style="padding:30px 16px;"><div class="icon" style="font-size:32px;">📦</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">暂无模块</div></div>
        </div>
    </aside>

    <main class="detail-panel">
        <div class="content-body" id="detailPanel">
            <div class="empty-state">
                <div class="icon">📦</div>
                <div class="title">选择一个模块</div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">在左侧列表中选择一个数据模块查看详情</div>
            </div>
        </div>
    </main>

    <div id="recordModal" class="modal-overlay" onclick="closeModal('recordModal')">
        <div class="modal-box" style="width:520px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="recordModalTitle">新增记录</h3>
                <button class="btn btn-secondary" onclick="closeModal('recordModal')">✕</button>
            </div>
            <div class="modal-body" id="recordFormBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('recordModal')">取消</button>
                <button class="btn btn-primary" onclick="saveRecord()">保存</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay" onclick="closeModal('detailModal')">
        <div class="modal-box" style="width:540px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>记录详情</h3>
                <button class="btn btn-secondary" onclick="closeModal('detailModal')">✕</button>
            </div>
            <div class="modal-body" id="recordDetailBody"></div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteFromDetail()">🗑️ 删除</button>
                <button class="btn btn-primary" onclick="editFromDetail()">✏️ 编辑</button>
                <button class="btn btn-secondary" onclick="closeModal('detailModal')">关闭</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
/*<![CDATA[*/
const API = '/api/datacenter';
let modules = [], allDatasets = [], currentModule = null, currentDs = null;
let currentDsId = null, allRecords = [], currentPage = 0, pageSize = 20, totalRecords = 0;
let viewingRecord = null, editingRecordId = null;

function toast(msg, type) {
    const d = document.createElement('div');
    d.className = 'msg msg-' + (type || 'info');
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2500);
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}
function showModal(id) {
    document.getElementById(id).classList.add('active');
}

function apiFetch(url, options) {
    if (!options) options = {};
    if (!options.headers) options.headers = {};
    var token = localStorage.getItem('Admin-Token');
    if (token) options.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, options);
}

function checkAuthError(r) {
    return r && (r.__401 || (r.code === 500 && r.msg === '认证失败'));
}

async function loadModules() {
    try {
        const [mRes, dRes] = await Promise.all([
            apiFetch(API + '/modules'),
            apiFetch(API + '/datasets')
        ]);
        const md = await mRes.json(), dd = await dRes.json();
        if (checkAuthError(md) || checkAuthError(dd)) { handleUnauthenticated(); return; }
        modules = md.ok ? (md.data || []) : [];
        allDatasets = dd.ok ? (dd.data || []) : [];
    } catch (e) {
        console.error('加载数据失败', e);
    }
    renderModuleList();
}

function renderModuleList() {
    const list = document.getElementById('moduleList');
    if (modules.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:30px 16px;"><div class="icon" style="font-size:32px;">📦</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">暂无模块</div></div>';
        return;
    }
    let html = '';
    for (let i = 0; i < modules.length; i++) {
        const m = modules[i];
        const dsList = allDatasets.filter(function(d){ return d.moduleId === m.id; });
        html += '<div class="module-item" onclick="showDatasetList(\'' + m.id + '\')">';
        html += '<span>' + m.name + '</span>';
        html += '</div>';
        for (let j = 0; j < dsList.length; j++) {
            const ds = dsList[j];
            const dsActive = currentDsId === ds.id ? ' active' : '';
            html += '<div class="ds-sub-item' + dsActive + '" onclick="openDataset(\'' + ds.id + '\')">';
            html += '<span>📋</span>';
            html += '<span>' + ds.name + '</span>';
            html += '<span class="ds-count">' + (ds.recordCount || 0) + ' 条</span>';
            html += '</div>';
        }
    }
    list.innerHTML = html;
}

function showDatasetList(moduleId) {
    currentModule = modules.find(function(m){ return m.id === moduleId; });
    currentDs = null;
    currentDsId = null;
    allRecords = [];
    renderModuleList();
    document.getElementById('detailPanel').innerHTML =
        '<div class="empty-state"><div class="icon">📦</div><div class="title">选择一个数据集</div>' +
        '<div style="font-size:13px;color:var(--text-muted);margin-top:8px;">在左侧列表中选择一个数据集查看记录</div></div>';
}

async function openDataset(dsId) {
    const ds = allDatasets.find(function(d){ return d.id === dsId; });
    if (!ds) return;
    currentDs = ds;
    currentDsId = dsId;
    localStorage.setItem('lastDatasetId', dsId);
    renderModuleList();
    await loadRecords(0);
}

function renderDatasetView() {
    if (!currentDs) return '';
    let html = '<div class="toolbar">';
    html += '<button class="btn btn-sm btn-primary" onclick="showAddRecord()">+ 新增记录</button>';
    html += '<div class="search-box"><input type="text" id="recordSearch" placeholder="🔍 搜索记录..." onkeyup="handleRecordSearch(event)"></div>';
    html += '<button class="btn btn-sm btn-secondary" onclick="handleRecordSearchBtn()">搜索</button>';
    html += '</div>';

    html += '<table class="data-table"><thead><tr><th>编码</th><th>类型</th><th>状态</th>';
    const fields = getFields(currentDs);
    for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        if (f.name !== 'status' && f.name !== 'type' && f.name !== 'id') {
            html += '<th>' + (f.displayName || f.name) + '</th>';
        }
    }
    html += '<th>操作</th></tr></thead><tbody>';

    for (let i = 0; i < allRecords.length; i++) {
        const rec = allRecords[i];
        html += '<tr><td>' + (rec.recordNum || rec['编号'] || '') + '</td>';
        html += '<td><span class="badge badge-gray">' + (rec.type || rec['类型'] || '') + '</span></td>';
        html += '<td><span class="badge badge-gray">' + (rec.status || rec['状态'] || '') + '</span></td>';
        for (let j = 0; j < fields.length; j++) {
            const f = fields[j];
            if (f.name !== 'status' && f.name !== 'type' && f.name !== 'id') {
                html += '<td>' + (rec[f.name] || rec[f.displayName] || '') + '</td>';
            }
        }
        const rid = rec._id || rec.id;
        html += '<td><button class="action-btn" onclick="viewRecord(\'' + rid + '\')">👁️</button>' +
            '<button class="action-btn" onclick="editRecord(\'' + rid + '\')">✏️</button>' +
            '<button class="action-btn" onclick="deleteRecord(\'' + rid + '\')">🗑️</button></td></tr>';
    }

    html += '</tbody></table>';
    if (allRecords.length === 0) {
        html += '<div class="empty-state"><div class="icon">📝</div><div class="title">暂无记录</div>' +
            '<button class="btn btn-primary" onclick="showAddRecord()">+ 新增记录</button></div>';
    }
    return html;
}

function getFields(ds) {
    if (!ds.schema || !ds.schema.fields) return [];
    return ds.schema.fields;
}

async function loadRecords(page) {
    if (!currentDs) return;
    currentPage = page;
    let url = API + '/datasets/' + currentDs.id + '/records?page=' + page + '&size=' + pageSize;
    const keyword = document.getElementById('recordSearch')?.value;
    if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
    const r = await apiFetch(url);
    const d = await r.json();
    if (checkAuthError(d)) { handleUnauthenticated(); return; }
    if (d.ok) {
        allRecords = d.data || [];
        totalRecords = d.total || 0;
    } else {
        allRecords = [];
    }
    document.getElementById('detailPanel').innerHTML = renderDatasetView();
}

function handleRecordSearch(e) {
    if (e.key === 'Enter') handleRecordSearchBtn();
}
function handleRecordSearchBtn() {
    loadRecords(0);
}

function requireLogin(action) {
    if (checkLogin()) { action(); return; }
    showLoginModal(action);
}

function showAddRecord() {
    requireLogin(function() {
        editingRecordId = null;
        document.getElementById('recordModalTitle').textContent = '新增记录';
        renderRecordForm();
        showModal('recordModal');
    });
}

function renderRecordForm(record) {
    const body = document.getElementById('recordFormBody');
    if (!currentDs || !currentDs.schema || !currentDs.schema.fields) {
        body.innerHTML = '<div>该数据集没有配置字段</div>';
        return;
    }
    let html = '';
    const recordNum = record ? (record.recordNum || record['编号'] || '') : '';
    html += '<div class="form-group"><label>编码</label><input id="recordNum" type="text" value="' + recordNum + '" placeholder="自动生成"></div>';

    const typeOpts = currentDs.schema.typeOptions || [];
    const curType = record ? (record.type || record['类型'] || '') : '';
    html += '<div class="form-group"><label>类型</label><select id="recordType"><option value="">请选择</option>';
    for (let i = 0; i < typeOpts.length; i++) {
        const sel = typeOpts[i] === curType ? ' selected' : '';
        html += '<option value="' + typeOpts[i] + '"' + sel + '>' + typeOpts[i] + '</option>';
    }
    html += '</select></div>';

    const fields = currentDs.schema.fields;
    for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        if (f.name === 'status' || f.name === 'type') continue;
        const val = record ? (record[f.name] || record[f.displayName] || '') : '';
        html += '<div class="form-group"><label>' + (f.displayName || f.name) + '</label><input id="recordField_' + f.name + '" type="text" value="' + val + '"></div>';
    }

    const statusOpts = currentDs.schema.statusOptions || [];
    const curStatus = record ? (record.status || record['状态'] || '') : '';
    html += '<div class="form-group"><label>状态</label><select id="recordStatus"><option value="">请选择</option>';
    for (let i = 0; i < statusOpts.length; i++) {
        const sel = statusOpts[i] === curStatus ? ' selected' : '';
        html += '<option value="' + statusOpts[i] + '"' + sel + '>' + statusOpts[i] + '</option>';
    }
    html += '</select></div>';

    body.innerHTML = html;
}

function editRecord(id) {
    requireLogin(function() {
        const record = allRecords.find(function(r){ return (r._id || r.id) === id; });
        if (!record) return;
        editingRecordId = id;
        document.getElementById('recordModalTitle').textContent = '编辑记录';
        renderRecordForm(record);
        showModal('recordModal');
    });
}

function editFromDetail() {
    if (!viewingRecord) return;
    editRecord(viewingRecord._id || viewingRecord.id);
    closeModal('detailModal');
}

function deleteFromDetail() {
    if (!viewingRecord) return;
    deleteRecord(viewingRecord._id || viewingRecord.id);
    closeModal('detailModal');
}

async function saveRecord() {
    if (!currentDs) return;
    const record = {
        type: document.getElementById('recordType').value,
        status: document.getElementById('recordStatus').value,
        recordNum: document.getElementById('recordNum').value
    };
    if (currentDs.schema && currentDs.schema.fields) {
        const fields = currentDs.schema.fields;
        for (let i = 0; i < fields.length; i++) {
            const f = fields[i];
            if (f.name !== 'status' && f.name !== 'type') {
                const el = document.getElementById('recordField_' + f.name);
                if (el) record[f.name] = el.value;
            }
        }
    }
    let url = API + '/datasets/' + currentDs.id + '/records';
    let method = 'POST';
    if (editingRecordId) {
        url += '/' + editingRecordId;
        method = 'PUT';
    }
    const r = await apiFetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: record })
    });
    const d = await r.json();
    if (checkAuthError(d)) { handleUnauthenticated(); return; }
    if (d.ok) {
        closeModal('recordModal');
        toast(editingRecordId ? '记录已更新' : '记录已新增', 'success');
        await loadRecords(currentPage);
    } else {
        toast(d.error || '保存失败', 'error');
    }
}

async function deleteRecord(id) {
    if (!confirm('确定要删除这条记录吗？')) return;
    requireLogin(async function() {
        const r = await apiFetch(API + '/datasets/' + currentDs.id + '/records/' + id, { method: 'DELETE' });
        const d = await r.json();
        if (checkAuthError(d)) { handleUnauthenticated(); return; }
        if (d.ok) {
            toast('记录已删除', 'success');
            await loadRecords(currentPage);
        } else {
            toast(d.error || '删除失败', 'error');
        }
    });
}

function viewRecord(id) {
    viewingRecord = allRecords.find(function(r){ return (r._id || r.id) === id; });
    if (!viewingRecord) return;
    const body = document.getElementById('recordDetailBody');
    let html = '<div class="detail-row"><div class="label">编码</div><div class="value">' +
        (viewingRecord.recordNum || viewingRecord['编号'] || '无') + '</div></div>';
    html += '<div class="detail-row"><div class="label">类型</div>' +
        '<div class="value"><span class="badge badge-gray">' + (viewingRecord.type || viewingRecord['类型'] || '无') + '</span></div></div>';
    if (currentDs && currentDs.schema && currentDs.schema.fields) {
        const fields = currentDs.schema.fields;
        for (let i = 0; i < fields.length; i++) {
            const f = fields[i];
            if (f.name === 'status' || f.name === 'type') continue;
            html += '<div class="detail-row"><div class="label">' + (f.displayName || f.name) +
                '</div><div class="value">' + (viewingRecord[f.name] || viewingRecord[f.displayName] || '') + '</div></div>';
        }
    }
    html += '<div class="detail-row"><div class="label">状态</div>' +
        '<div class="value"><span class="badge badge-gray">' + (viewingRecord.status || viewingRecord['状态'] || '无') + '</span></div></div>';
    body.innerHTML = html;
    showModal('detailModal');
}

function handleUnauthenticated() {
    localStorage.removeItem('Admin-Token');
    document.cookie = 'Admin-Token=; path=/; max-age=0; SameSite=Lax';
    document.getElementById('moduleList').innerHTML = '<div class="empty-state" style="padding:30px 16px;"><div class="icon" style="font-size:32px;">🔐</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">需要登录</div></div>';
    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><div class="icon">🔐</div><div class="title">需要登录</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">登录后即可查看数据中心</div></div>';
    showLoginModal(function() { window.location.href = window.location.href; });
}

function checkLogin() {
    return !!localStorage.getItem('Admin-Token');
}

async function init() {
    if (!checkLogin()) { handleUnauthenticated(); return; }
    await loadModules();
    const lastId = localStorage.getItem('lastDatasetId');
    const target = lastId ? allDatasets.find(function(d){ return d.id === lastId; }) : null;
    if (target) {
        await openDataset(target.id);
    } else if (allDatasets.length > 0) {
        await openDataset(allDatasets[0].id);
    }
}
init();

document.addEventListener('auth-change', function() {
    if (!checkLogin()) handleUnauthenticated();
});
</script>

</body>
</html>
