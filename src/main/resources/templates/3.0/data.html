<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'启航 AI 协作平台 - ' + (${selectedModuleId != null} ? '数据模块' : '数据中心')">启航 AI 协作平台 - 数据中心</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --success: #22c55e;
            --warning: #fb923c;
            --danger: #ef4444;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }

        .nav-sidebar { width: 64px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; align-items: center; }
        .nav-sidebar .sidebar-header { padding: 0 8px 16px; }
        .nav-sidebar .sidebar-title svg { width: 24px; height: 24px; }
        .nav-sidebar .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; align-items: center; }
        .nav-sidebar .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; cursor: pointer; color: var(--text-secondary); font-size: 11px; transition: all 0.2s; border-radius: var(--radius-md); text-decoration: none; width: 48px; }
        .nav-sidebar .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-sidebar .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-sidebar .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .nav-sidebar .sidebar-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 16px; }

        .module-sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .module-sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .module-sidebar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .new-module-btn { width: 100%; padding: 8px 12px; border: none; background: var(--primary); color: white; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; transition: all 0.2s; }
        .new-module-btn:hover { background: var(--primary-dark); }
        .module-sidebar-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .module-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all 0.2s; border-radius: var(--radius-sm); margin: 0 4px; }
        .module-item:hover { background: var(--hover); color: var(--text-primary); }
        .module-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .module-item .delete-btn { margin-left: auto; opacity: 0; color: var(--text-muted); transition: all 0.2s; background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .module-item:hover .delete-btn { opacity: 1; }
        .module-item .delete-btn:hover { color: #ef4444; }
        .module-item .edit-btn { opacity: 0; color: var(--text-muted); transition: all 0.2s; background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
        .module-item:hover .edit-btn { opacity: 1; }
        .module-item .edit-btn:hover { color: var(--primary); }
        .module-item-icon { font-size: 18px; flex-shrink: 0; }
        .module-item-info { flex: 1; min-width: 0; }
        .module-item-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .module-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

        .detail-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .detail-panel .content-body { flex: 1; overflow-y: auto; padding: 24px; }

        .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: white; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-gray { background: #f5f5f7; color: #909296; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; transition: all 0.2s; background: white; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state .title { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .module-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .module-header .module-icon { font-size: 32px; }
        .module-header .module-title { font-size: 20px; font-weight: 600; }
        .module-header .module-desc { font-size: 13px; color: var(--text-muted); }
        .module-header .module-stats { display: flex; gap: 16px; margin-left: 8px; }
        .module-header .stat-value { font-size: 18px; font-weight: 600; color: var(--primary); }
        .module-header .stat-label { font-size: 11px; color: var(--text-muted); }
        .module-header .module-actions { margin-left: auto; display: flex; gap: 6px; }

        .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .ds-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: all 0.2s; }
        .ds-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .ds-card-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .ds-card-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .ds-card-bottom { display: flex; gap: 16px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
        .ds-card-stat strong { color: var(--primary); font-size: 14px; }

        .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th { text-align: left; padding: 10px 12px; background: #f8fafc; border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-secondary); }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .data-table tr:hover { background: var(--hover); }
        .data-table .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text-muted); padding: 2px 6px; }
        .data-table .action-btn:hover { color: var(--primary); }
        .data-table .action-btn.danger:hover { color: var(--danger); }

        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .detail-row .value { font-size: 13px; color: var(--text-primary); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-header h3 { font-size: 16px; font-weight: 600; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

        .msg { padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 8px; }
        .msg-success { background: #dcfce7; color: #166534; }
        .msg-error { background: #fee2e2; color: #991b1b; }
        .msg-info { background: #dbeafe; color: #1e40af; }

    </style>
</head>
<body>
    <aside class="nav-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
        </div>
        
        <nav class="nav-menu">
            <a href="/chat" class="nav-item" th:classappend="${currentNav == 'chat' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>对话</span>
            </a>
            <a href="/insights" class="nav-item" th:classappend="${currentNav == 'insights' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h6v6m-6 0V3m0 6H9m6 6h6v-6m-6 0v6m0-6H9"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span>洞察</span>
            </a>
            <a href="/notes" class="nav-item" th:classappend="${currentNav == 'notes' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>笔记</span>
            </a>
            <a href="/data" class="nav-item" th:classappend="${currentNav == 'data' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="12" y1="12" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="12" y2="12"/>
                </svg>
                <span>数据</span>
            </a>
            <a href="/planner" class="nav-item" th:classappend="${currentNav == 'planner' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>任务</span>
            </a>
            <a href="/tools" class="nav-item" th:classappend="${currentNav == 'tools' ? 'active' : ''}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span>工具</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <a href="/config" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>配置</span>
            </a>
            <a href="/log" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="13" x2="15" y2="13"/>
                    <line x1="9" y1="17" x2="13" y2="17"/>
                </svg>
                <span>日志</span>
            </a>
            <a href="/help" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                <span>帮助</span>
            </a>
        </div>
    </aside>
    
    <aside class="module-sidebar">
        <div class="module-sidebar-header">
            <div class="module-sidebar-title">模块</div>
            <button class="new-module-btn" onclick="showCreateModule()">+ 新建模块</button>
        </div>
        <div class="module-sidebar-list" id="moduleList">
            <div class="empty-state" style="padding:30px 16px;"><div class="icon" style="font-size:32px;">📦</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">暂无模块</div></div>
        </div>
    </aside>
    
    <main class="detail-panel">
        <div class="content-body" id="detailPanel">
            <div class="empty-state">
                <div class="icon">📦</div>
                <div class="title">选择一个模块</div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">在左侧列表中选择一个数据模块查看详情</div>
            </div>
        </div>
    </main>

    <div id="moduleModal" class="modal-overlay" onclick="closeModal('moduleModal')">
        <div class="modal-box" style="width:420px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="moduleModalTitle">新建模块</h3>
                <button onclick="closeModal('moduleModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>模块名称 *</label>
                    <input id="moduleName" type="text" placeholder="如：客户管理">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <input id="moduleDesc" type="text" placeholder="模块用途说明">
                </div>
                <div class="form-group">
                    <label>图标</label>
                    <input id="moduleIcon" type="text" placeholder="📁">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('moduleModal')">取消</button>
                <button class="btn btn-primary" onclick="saveModule()">保存</button>
            </div>
        </div>
    </div>

    <div id="dsModal" class="modal-overlay" onclick="closeModal('dsModal')">
        <div class="modal-box" style="width:520px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="dsModalTitle">新建数据集</h3>
                <button onclick="closeModal('dsModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>名称 *</label>
                    <input id="dsName" type="text" placeholder="如：客户信息">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="dsDesc" rows="2" style="resize:vertical;font-family:inherit;"></textarea>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <input id="dsType" type="text" placeholder="如：项目管理">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <input id="dsStatus" type="text" placeholder="如：启用">
                </div>
                <div class="form-group">
                    <label>Schema 字段（每行一个）</label>
                    <textarea id="dsSchema" rows="3" style="resize:vertical;font-family:monospace;font-size:12px;" placeholder="编号&#10;项目&#10;负责人"></textarea>
                </div>
                <div class="form-group">
                    <label>类型选项（每行一个）</label>
                    <textarea id="dsTypeOptions" rows="2" style="resize:vertical;font-family:monospace;font-size:12px;" placeholder="需求&#10;Bug&#10;优化"></textarea>
                </div>
                <div class="form-group">
                    <label>状态选项（每行一个）</label>
                    <textarea id="dsStatusOptions" rows="2" style="resize:vertical;font-family:monospace;font-size:12px;" placeholder="待办&#10;进行中&#10;已完成"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('dsModal')">取消</button>
                <button class="btn btn-primary" onclick="saveDataset()">保存</button>
            </div>
        </div>
    </div>

    <div id="recordModal" class="modal-overlay" onclick="closeModal('recordModal')">
        <div class="modal-box" style="width:520px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="recordModalTitle">新增记录</h3>
                <button onclick="closeModal('recordModal')">✕</button>
            </div>
            <div class="modal-body" id="recordFormBody">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('recordModal')">取消</button>
                <button class="btn btn-primary" onclick="saveRecord()">保存</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay" onclick="closeModal('detailModal')">
        <div class="modal-box" style="width:540px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>记录详情</h3>
                <button onclick="closeModal('detailModal')">✕</button>
            </div>
            <div class="modal-body" id="recordDetailBody">
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="deleteFromDetail()">🗑️ 删除</button>
                <button class="btn btn-primary" onclick="editFromDetail()">✏️ 编辑</button>
                <button class="btn btn-secondary" onclick="closeModal('detailModal')">关闭</button>
            </div>
        </div>
    </div>

    <div id="importModal" class="modal-overlay" onclick="closeModal('importModal')">
        <div class="modal-box" style="width:520px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>📥 数据导入</h3>
                <button onclick="closeModal('importModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>导入方式</label>
                    <div style="display:flex;gap:8px;">
                        <button class="btn" id="importTypeJson" onclick="setImportType('json')">📝 JSON</button>
                        <button class="btn" id="importTypeExcel" onclick="setImportType('excel')">📊 Excel</button>
                        <button class="btn" id="importTypeUrl" onclick="setImportType('url')">🔗 URL</button>
                    </div>
                </div>
                
                <div id="importJsonSection" class="form-group">
                    <label>JSON 数据</label>
                    <textarea id="importJsonData" rows="8" style="resize:vertical;font-family:monospace;font-size:12px;" placeholder="JSON数组格式"></textarea>
                </div>
                
                <div id="importExcelSection" class="form-group" style="display:none;">
                    <label>Excel 文件</label>
                    <input type="file" accept=".xlsx,.xls" id="importExcelFile" onchange="handleExcelFile(this)">
                    <div id="importExcelName" style="font-size:12px;color:var(--primary);margin-top:4px;"></div>
                </div>
                
                <div id="importUrlSection" class="form-group" style="display:none;">
                    <label>数据 URL</label>
                    <input id="importUrl" type="text" placeholder="https://example.com/data.json">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('importModal')">取消</button>
                <button class="btn btn-primary" onclick="doImport()">开始导入</button>
            </div>
        </div>
    </div>

    <script>
const API = '/api/datacenter';
let modules = [], allDatasets = [], datasets = [], currentModule = null, currentDs = null;
let allRecords = [], currentPage = 0, pageSize = 20, totalRecords = 0;
let editingModuleId = null, editingDsId = null, editingRecordId = null, viewingRecord = null;
let importType = 'json', excelFile = null;

function toast(msg, type) {
    const d = document.createElement('div');
    d.className = 'msg msg-' + type;
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2500);
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function showModal(id) {
    document.getElementById(id).classList.add('active');
}

async function loadModules() {
    try {
        const [mRes, dRes] = await Promise.all([
            fetch(API + '/modules'),
            fetch(API + '/datasets')
        ]);
        const md = await mRes.json(), dd = await dRes.json();
        modules = md.ok ? (md.data || []) : [];
        allDatasets = dd.ok ? (dd.data || []) : [];
        datasets = allDatasets;
    } catch (e) {
        console.error('加载数据失败', e);
    }
    renderModuleList();
}

function renderModuleList() {
    const list = document.getElementById('moduleList');
    const dsPool = allDatasets.length ? allDatasets : datasets;
    if (modules.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:30px 16px;"><div class="icon" style="font-size:32px;">📦</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">暂无模块</div><button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="showCreateModule()">+ 新建模块</button></div>';
    } else {
        let html = '';
        for (let i = 0; i < modules.length; i++) {
            const m = modules[i];
            const dsCount = dsPool.filter(function(d){ return d.moduleId === m.id; }).length;
            const recCount = dsPool.filter(function(d){ return d.moduleId === m.id; }).reduce(function(s, d){ return s + (d.recordCount || 0); }, 0);
            const active = currentModule && currentModule.id === m.id ? ' active' : '';
            html += '<div class="module-item' + active + '" onclick="openModule(\'' + m.id + '\')">';
            html += '<span class="module-item-icon">' + (m.icon || '📁') + '</span>';
            html += '<div class="module-item-info">';
            html += '<div class="module-item-name">' + m.name + '</div>';
            html += '<div class="module-item-meta">' + dsCount + ' 数据集 · ' + recCount + ' 记录</div>';
            html += '</div>';
            html += '<button class="edit-btn" onclick="event.stopPropagation(); showEditModule(\'' + m.id + '\')" title="编辑">✏️</button>';
            html += '<button class="delete-btn" onclick="event.stopPropagation(); deleteModule(\'' + m.id + '\')" title="删除">🗑️</button>';
            html += '</div>';
        }
        list.innerHTML = html;
    }
}

function showCreateModule() {
    editingModuleId = null;
    document.getElementById('moduleModalTitle').textContent = '新建模块';
    document.getElementById('moduleName').value = '';
    document.getElementById('moduleDesc').value = '';
    document.getElementById('moduleIcon').value = '📁';
    showModal('moduleModal');
}

function showEditModule(id) {
    const m = modules.find(function(x){ return x.id === id; });
    if (!m) return;
    editingModuleId = id;
    document.getElementById('moduleModalTitle').textContent = '编辑模块';
    document.getElementById('moduleName').value = m.name;
    document.getElementById('moduleDesc').value = m.description || '';
    document.getElementById('moduleIcon').value = m.icon || '📁';
    showModal('moduleModal');
}

async function saveModule() {
    const data = {
        name: document.getElementById('moduleName').value,
        description: document.getElementById('moduleDesc').value,
        icon: document.getElementById('moduleIcon').value
    };
    let url = API + '/modules';
    let method = 'POST';
    if (editingModuleId) {
        url += '/' + editingModuleId;
        method = 'PUT';
    }
    const r = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const d = await r.json();
    if (d.ok) {
        closeModal('moduleModal');
        toast(editingModuleId ? '模块已更新' : '模块已创建', 'success');
        await loadModules();
    } else {
        toast(d.error || '保存失败', 'error');
    }
}

async function deleteModule(id) {
    if (!confirm('确定要删除该模块吗？')) return;
    const r = await fetch(API + '/modules/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) {
        toast('模块已删除', 'success');
        if (currentModule && currentModule.id === id) {
            currentModule = null;
            datasets = [];
            backToList();
        } else {
            await loadModules();
        }
    } else {
        toast(d.error || '删除失败', 'error');
    }
}

async function openModule(id) {
    currentModule = { id: id };
    renderModuleList();
    await loadModuleDetail(id);
}

async function loadModuleDetail(id) {
    const [mRes, dRes] = await Promise.all([
        fetch(API + '/modules/' + id),
        fetch(API + '/modules/' + id + '/datasets')
    ]);
    const md = await mRes.json(), dd = await dRes.json();
    if (md.ok) currentModule = md.data;
    datasets = dd.ok ? dd.data : [];
    totalRecords = datasets.reduce(function(s, d){ return s + (d.recordCount || 0); }, 0);
    renderModuleDetail();
}

function renderModuleDetail() {
    const panel = document.getElementById('detailPanel');
    let html = '<div class="module-header">';
    html += '<span class="module-icon">' + (currentModule.icon || '📁') + '</span>';
    html += '<div>';
    html += '<div class="module-title">' + currentModule.name + '</div>';
    html += '<div class="module-desc">' + (currentModule.description || '') + '</div>';
    html += '</div>';
    html += '<div class="module-stats">';
    html += '<div><div class="stat-value">' + datasets.length + '</div><div class="stat-label">数据集</div></div>';
    html += '<div><div class="stat-value">' + totalRecords + '</div><div class="stat-label">记录</div></div>';
    html += '</div>';
    html += '<div class="module-actions">';
    html += '<button class="btn btn-secondary btn-sm" onclick="showCreateDataset()">+ 新建</button>';
    html += '<button class="btn btn-secondary btn-sm" onclick="showEditModule(\'' + currentModule.id + '\')">✏️ 编辑</button>';
    html += '</div></div>';

    if (datasets.length === 0) {
        html += '<div class="empty-state" style="margin-top:40px;"><div class="icon">📋</div><div class="title">暂无数据集</div><button class="btn btn-primary" onclick="showCreateDataset()">+ 新建数据集</button></div>';
    } else {
        html += '<div class="ds-grid">';
        for (let i = 0; i < datasets.length; i++) {
            const ds = datasets[i];
            html += '<div class="ds-card" onclick="openDataset(\'' + ds.id + '\')">';
            html += '<div class="ds-card-name">' + ds.name + '</div>';
            html += '<div class="ds-card-desc">' + (ds.description || '') + '</div>';
            html += '<div class="ds-card-bottom">';
            html += '<div class="ds-card-stat">记录 <strong>' + (ds.recordCount || 0) + '</strong></div>';
            html += '<div style="margin-left:auto;color:var(--text-muted);">查看 →</div>';
            html += '</div></div>';
        }
        html += '</div>';
    }

    panel.innerHTML = html;
}

function backToList() {
    currentModule = null;
    currentDs = null;
    document.getElementById('detailPanel').innerHTML = '<div class="empty-state"><div class="icon">📦</div><div class="title">选择一个模块</div><div style="font-size:13px;color:var(--text-muted);margin-top:8px;">在左侧列表中选择一个数据模块查看详情</div></div>';
    renderModuleList();
}

async function openDataset(dsId) {
    const ds = datasets.find(function(d){ return d.id === dsId; });
    if (!ds) return;
    currentDs = ds;
    await loadRecords(0);
}

function showDatasetList() {
    currentDs = null;
    allRecords = [];
    renderModuleDetail();
}

function renderDatasetView() {
    if (!currentDs) return '';
    let html = '<div class="toolbar">';
    html += '<button class="btn btn-sm btn-secondary" onclick="showDatasetList()">← 返回</button>';
    html += '<div class="search-box"><input type="text" id="recordSearch" placeholder="🔍 搜索记录..." onkeyup="handleRecordSearch(event)"></div>';
    html += '<button class="btn btn-sm btn-secondary" onclick="handleRecordSearchBtn()">搜索</button>';
    html += '<button class="btn btn-sm btn-primary" onclick="showAddRecord()">+ 新增</button>';
    html += '<button class="btn btn-sm btn-secondary" onclick="showEditDataset(\'' + currentDs.id + '\')">✏️ 编辑</button>';
    html += '<button class="btn btn-sm btn-secondary" onclick="showImportModal()">📥 导入</button>';
    html += '<button class="btn btn-sm btn-danger" onclick="deleteDataset(\'' + currentDs.id + '\')">🗑️ 删除</button>';
    html += '</div>';
    
    html += '<table class="data-table"><thead><tr><th>状态</th>';
    const fields = getFields(currentDs);
    for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        if (f.name !== 'status' && f.name !== 'type' && f.name !== 'id') {
            html += '<th>' + (f.displayName || f.name) + '</th>';
        }
    }
    html += '<th>操作</th></tr></thead><tbody>';
    
    for (let i = 0; i < allRecords.length; i++) {
        const rec = allRecords[i];
        html += '<tr><td><span class="badge badge-gray">' + (rec.status || '无') + '</span></td>';
        for (let j = 0; j < fields.length; j++) {
            const f = fields[j];
            if (f.name !== 'status' && f.name !== 'type' && f.name !== 'id') {
                html += '<td>' + (rec[f.name] || rec[f.displayName] || '') + '</td>';
            }
        }
        const rid = rec._id || rec.id;
        html += '<td><button class="action-btn" onclick="viewRecord(\'' + rid + '\')">👁️</button>';
        html += '<button class="action-btn" onclick="editRecord(\'' + rid + '\')">✏️</button>';
        html += '<button class="action-btn danger" onclick="deleteRecord(\'' + rid + '\')">🗑️</button></td></tr>';
    }
    
    html += '</tbody></table>';
    
    if (allRecords.length === 0) {
        html += '<div class="empty-state"><div class="icon">📝</div><div class="title">暂无记录</div><button class="btn btn-primary" onclick="showAddRecord()">+ 新增记录</button></div>';
    }
    
    return html;
}

function getFields(ds) {
    if (!ds.schema || !ds.schema.fields) return [];
    return ds.schema.fields;
}

async function loadRecords(page) {
    if (!currentDs) return;
    currentPage = page;
    let url = API + '/datasets/' + currentDs.id + '/records?page=' + page + '&size=' + pageSize;
    const keyword = document.getElementById('recordSearch')?.value;
    if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
    const r = await fetch(url);
    const d = await r.json();
    if (d.ok) {
        allRecords = d.data || [];
        totalRecords = d.total || 0;
    } else {
        allRecords = [];
    }
    renderDatasetView();
}

function handleRecordSearch(e) {
    if (e.key === 'Enter') handleRecordSearchBtn();
}

function handleRecordSearchBtn() {
    loadRecords(0);
}

function showCreateDataset() {
    editingDsId = null;
    document.getElementById('dsModalTitle').textContent = '新建数据集';
    document.getElementById('dsName').value = '';
    document.getElementById('dsDesc').value = '';
    document.getElementById('dsType').value = '';
    document.getElementById('dsStatus').value = '';
    document.getElementById('dsSchema').value = '';
    document.getElementById('dsTypeOptions').value = '';
    document.getElementById('dsStatusOptions').value = '';
    showModal('dsModal');
}

function showEditDataset(id) {
    const ds = datasets.find(function(d){ return d.id === id; });
    if (!ds) return;
    editingDsId = id;
    document.getElementById('dsModalTitle').textContent = '编辑数据集';
    document.getElementById('dsName').value = ds.name;
    document.getElementById('dsDesc').value = ds.description || '';
    document.getElementById('dsType').value = ds.type || '';
    document.getElementById('dsStatus').value = ds.status || '';
    if (ds.schema && ds.schema.fields) {
        document.getElementById('dsSchema').value = ds.schema.fields.map(function(f){ return f.displayName || f.name; }).join('\n');
    } else {
        document.getElementById('dsSchema').value = '';
    }
    if (ds.schema && ds.schema.typeOptions) {
        document.getElementById('dsTypeOptions').value = ds.schema.typeOptions.join('\n');
    } else {
        document.getElementById('dsTypeOptions').value = '';
    }
    if (ds.schema && ds.schema.statusOptions) {
        document.getElementById('dsStatusOptions').value = ds.schema.statusOptions.join('\n');
    } else {
        document.getElementById('dsStatusOptions').value = '';
    }
    showModal('dsModal');
}

async function saveDataset() {
    if (!currentModule) {
        toast('请先选择模块', 'error');
        return;
    }
    const fields = document.getElementById('dsSchema').value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
    const schema = {
        fields: fields.map(function(name){ return { name: name, displayName: name, type: 'text' }; }),
        typeOptions: document.getElementById('dsTypeOptions').value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; }),
        statusOptions: document.getElementById('dsStatusOptions').value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; })
    };
    const data = {
        moduleId: currentModule.id,
        name: document.getElementById('dsName').value,
        description: document.getElementById('dsDesc').value,
        type: document.getElementById('dsType').value,
        status: document.getElementById('dsStatus').value,
        schema: schema
    };
    let url = API + '/datasets';
    let method = 'POST';
    if (editingDsId) {
        url += '/' + editingDsId;
        method = 'PUT';
    }
    const r = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const d = await r.json();
    if (d.ok) {
        closeModal('dsModal');
        toast(editingDsId ? '数据集已更新' : '数据集已创建', 'success');
        await loadModuleDetail(currentModule.id);
    } else {
        toast(d.error || '保存失败', 'error');
    }
}

async function deleteDataset(id) {
    if (!confirm('确定要删除该数据集吗？')) return;
    const r = await fetch(API + '/datasets/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) {
        toast('数据集已删除', 'success');
        await loadModuleDetail(currentModule.id);
        if (currentDs && currentDs.id === id) {
            currentDs = null;
            allRecords = [];
        }
    } else {
        toast(d.error || '删除失败', 'error');
    }
}

function showAddRecord() {
    editingRecordId = null;
    document.getElementById('recordModalTitle').textContent = '新增记录';
    renderRecordForm();
    showModal('recordModal');
}

function renderRecordForm(record) {
    const body = document.getElementById('recordFormBody');
    if (!currentDs || !currentDs.schema || !currentDs.schema.fields) {
        body.innerHTML = '<div>该数据集没有配置字段</div>';
        return;
    }
    
    let html = '<div class="form-group"><label>状态</label><input id="recordStatus" type="text" value="' + (record ? record.status : '进行中') + '"></div>';
    
    const fields = currentDs.schema.fields;
    for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        if (f.name === 'status' || f.name === 'type') continue;
        const val = record ? (record[f.name] || record[f.displayName] || '') : '';
        html += '<div class="form-group"><label>' + (f.displayName || f.name) + '</label><input id="recordField_' + f.name + '" type="text" value="' + val + '"></div>';
    }
    
    body.innerHTML = html;
}

function viewRecord(id) {
    viewingRecord = allRecords.find(function(r){ return (r._id || r.id) === id; });
    if (!viewingRecord) return;
    
    const body = document.getElementById('recordDetailBody');
    let html = '<div class="detail-row"><div class="label">状态</div><div class="value"><span class="badge badge-gray">' + (viewingRecord.status || '无') + '</span></div></div>';
    
    if (currentDs && currentDs.schema && currentDs.schema.fields) {
        const fields = currentDs.schema.fields;
        for (let i = 0; i < fields.length; i++) {
            const f = fields[i];
            if (f.name === 'status') continue;
            html += '<div class="detail-row"><div class="label">' + (f.displayName || f.name) + '</div><div class="value">' + (viewingRecord[f.name] || viewingRecord[f.displayName] || '') + '</div></div>';
        }
    }
    
    body.innerHTML = html;
    showModal('detailModal');
}

function editRecord(id) {
    const record = allRecords.find(function(r){ return (r._id || r.id) === id; });
    if (!record) return;
    editingRecordId = id;
    document.getElementById('recordModalTitle').textContent = '编辑记录';
    renderRecordForm(record);
    showModal('recordModal');
}

function editFromDetail() {
    if (!viewingRecord) return;
    editRecord(viewingRecord._id || viewingRecord.id);
    closeModal('detailModal');
}

function deleteFromDetail() {
    if (!viewingRecord) return;
    deleteRecord(viewingRecord._id || viewingRecord.id);
    closeModal('detailModal');
}

async function saveRecord() {
    if (!currentDs) return;
    
    const record = {
        status: document.getElementById('recordStatus').value,
        type: currentDs.type || ''
    };
    
    if (currentDs.schema && currentDs.schema.fields) {
        const fields = currentDs.schema.fields;
        for (let i = 0; i < fields.length; i++) {
            const f = fields[i];
            if (f.name !== 'status' && f.name !== 'type') {
                const el = document.getElementById('recordField_' + f.name);
                if (el) record[f.name] = el.value;
            }
        }
    }
    
    let url = API + '/datasets/' + currentDs.id + '/records';
    let method = 'POST';
    if (editingRecordId) {
        url += '/' + editingRecordId;
        method = 'PUT';
    }
    
    const r = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: editingRecordId ? JSON.stringify(record) : JSON.stringify({ data: record, useAi: false })
    });
    const d = await r.json();
    if (d.ok) {
        closeModal('recordModal');
        toast(editingRecordId ? '记录已更新' : '记录已新增', 'success');
        await loadRecords(currentPage);
    } else {
        toast(d.error || '保存失败', 'error');
    }
}

async function deleteRecord(id) {
    if (!confirm('确定要删除这条记录吗？')) return;
    const r = await fetch(API + '/datasets/' + currentDs.id + '/records/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (d.ok) {
        toast('记录已删除', 'success');
        await loadRecords(currentPage);
    } else {
        toast(d.error || '删除失败', 'error');
    }
}

function showImportModal() {
    importType = 'json';
    setImportType('json');
    document.getElementById('importJsonData').value = '';
    document.getElementById('importUrl').value = '';
    document.getElementById('importExcelFile').value = '';
    document.getElementById('importExcelName').textContent = '';
    excelFile = null;
    showModal('importModal');
}

function setImportType(type) {
    importType = type;
    document.getElementById('importTypeJson').className = 'btn' + (type === 'json' ? ' btn-primary' : ' btn-secondary');
    document.getElementById('importTypeExcel').className = 'btn' + (type === 'excel' ? ' btn-primary' : ' btn-secondary');
    document.getElementById('importTypeUrl').className = 'btn' + (type === 'url' ? ' btn-primary' : ' btn-secondary');
    document.getElementById('importJsonSection').style.display = type === 'json' ? 'block' : 'none';
    document.getElementById('importExcelSection').style.display = type === 'excel' ? 'block' : 'none';
    document.getElementById('importUrlSection').style.display = type === 'url' ? 'block' : 'none';
}

function handleExcelFile(input) {
    const file = input.files[0];
    if (file) {
        excelFile = file;
        document.getElementById('importExcelName').textContent = '已选择: ' + file.name;
    }
}

async function doImport() {
    if (!currentDs) {
        toast('请先选择数据集', 'error');
        return;
    }
    
    let r;
    if (importType === 'json') {
        const data = document.getElementById('importJsonData').value;
        if (!data.trim()) {
            toast('请输入JSON数据', 'error');
            return;
        }
        try {
            JSON.parse(data);
        } catch(e) {
            toast('JSON格式错误', 'error');
            return;
        }
        r = await fetch(API + '/datasets/' + currentDs.id + '/import/json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: JSON.parse(data), useAi: false })
        });
    } else if (importType === 'excel') {
        if (!excelFile) {
            toast('请选择Excel文件', 'error');
            return;
        }
        const formData = new FormData();
        formData.append('file', excelFile);
        r = await fetch(API + '/datasets/' + currentDs.id + '/import/excel', {
            method: 'POST',
            body: formData
        });
    } else if (importType === 'url') {
        const url = document.getElementById('importUrl').value;
        if (!url.trim()) {
            toast('请输入URL', 'error');
            return;
        }
        r = await fetch(API + '/datasets/' + currentDs.id + '/import/url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url.trim() })
        });
    }
    
    const d = await r.json();
    if (d.ok) {
        closeModal('importModal');
        toast('导入成功，共 ' + (d.count || 0) + ' 条记录', 'success');
        await loadRecords(0);
    } else {
        toast(d.error || '导入失败', 'error');
    }
}

async function init() {
    await loadModules();
    if (modules.length > 0) {
        await openModule(modules[0].id);
    }
}
init();
</script>
</body>
</html>
