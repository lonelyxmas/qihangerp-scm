<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔灵 AI - 工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }
        
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; }
        .sidebar-header { padding: 0 16px 16px; }
        .sidebar-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-title svg { width: 24px; height: 24px; }
        
        .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; color: var(--text-secondary); font-size: 14px; transition: all 0.2s; border-radius: 0 var(--radius-md) var(--radius-md) 0; }
        .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .content-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: white; }
        .content-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }

        .content-body { flex: 1; overflow-y: auto; padding: 24px; }

        .section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        
        .tool-card { background: white; border-radius: var(--radius-md); border: 1px solid var(--border); padding: 20px; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
        .tool-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); transform: translateY(-2px); }
        
        .tool-card .icon { font-size: 36px; margin-bottom: 12px; }
        .tool-card .name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .tool-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
        .tool-card .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                笔灵 AI
            </div>
        </div>
        
        <nav class="nav-menu">
            <div class="nav-item" onclick="navigate('/v3/chat')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                对话
            </div>
            <div class="nav-item" onclick="navigate('/v3/ai')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 14s1.5-2 4-2 4 2 4 2"/>
                    <circle cx="9" cy="9" r="1"/>
                    <circle cx="15" cy="9" r="1"/>
                </svg>
                AI 概览
            </div>
            <div class="nav-item" onclick="navigate('/v3/notes')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                笔记
            </div>
            <div class="nav-item" onclick="navigate('/v3/data')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="12" y1="12" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="12" y2="12"/>
                </svg>
                数据
            </div>
            <div class="nav-item" onclick="navigate('/v3/planner')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                任务提醒
            </div>
            <div class="nav-item active" onclick="navigate('/v3/tools')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                工具箱
            </div>
        </nav>
        
        <div class="sidebar-footer">
            <div class="nav-item" onclick="navigate('/config')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                配置
            </div>
            <div class="nav-item" onclick="navigate('/coding')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
                编程AI
            </div>
            <div class="nav-item" onclick="navigate('/log')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                日志
            </div>
            <div class="nav-item" onclick="navigate('/help')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                帮助
            </div>
        </div>
    </aside>
    
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">工具箱</h1>
        </div>
        
        <div class="content-body">
            <div class="section-title">🖼️ 图像识别</div>
            <div class="tools-grid">
                <a href="/image/general" class="tool-card">
                    <div class="icon">🖼️</div>
                    <div class="name">通用识别</div>
                    <div class="desc">上传图片，AI 自动识别内容并分析。支持多种场景：风景、文字、图表等。</div>
                    <span class="tag">多模态</span>
                </a>
                <a href="/image/solve" class="tool-card">
                    <div class="icon">❓</div>
                    <div class="name">识题</div>
                    <div class="desc">拍照上传题目，AI 给出详细解答过程和答案。支持追问，深入理解。</div>
                    <span class="tag">学习</span>
                </a>
                <a href="/image/exam" class="tool-card">
                    <div class="icon">📝</div>
                    <div class="name">试卷识别</div>
                    <div class="desc">识别整张试卷，自动提取题目、答案、解析，建立个人题库。</div>
                    <span class="tag">学习</span>
                </a>
            </div>
            
            <div class="section-title">📊 数据工具</div>
            <div class="tools-grid">
                <a href="/data/import" class="tool-card">
                    <div class="icon">📥</div>
                    <div class="name">数据导入</div>
                    <div class="desc">从外部导入数据到笔记库，支持 JSON、CSV 等格式。</div>
                    <span class="tag">数据</span>
                </a>
                <a href="/data/collector" class="tool-card">
                    <div class="icon">🔧</div>
                    <div class="name">数据采集</div>
                    <div class="desc">从网页或 API 自动采集数据，定时执行。</div>
                    <span class="tag">数据</span>
                </a>
                <a href="/data/processing" class="tool-card">
                    <div class="icon">📋</div>
                    <div class="name">数据加工</div>
                    <div class="desc">对采集的数据进行清洗、转换、标准化处理。</div>
                    <span class="tag">数据</span>
                </a>
            </div>
        </div>
    </main>
    
    <script>
        function navigate(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
