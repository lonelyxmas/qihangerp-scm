<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启航 AI 协作平台 - 工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --hover: #f1f5f9;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
        }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { display: flex; background: var(--bg-main); color: var(--text-primary); }
        
        .sidebar { width: 64px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; flex-shrink: 0; align-items: center; }
        .sidebar-header { padding: 0 8px 16px; }
        .sidebar-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .sidebar-title svg { width: 24px; height: 24px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; cursor: pointer; color: var(--text-secondary); font-size: 11px; transition: all 0.2s; border-radius: var(--radius-md); text-decoration: none; width: 48px; }
        .nav-item:hover { background: var(--hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); font-weight: 500; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 16px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .content-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: white; }
        .content-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }

        .content-body { flex: 1; overflow-y: auto; padding: 24px; }

        .section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        
        .tool-card { background: white; border-radius: var(--radius-md); border: 1px solid var(--border); padding: 20px; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
        .tool-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); transform: translateY(-2px); }
        
        .tool-card .icon { font-size: 36px; margin-bottom: 12px; }
        .tool-card .name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .tool-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
        .tool-card .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>
    
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">工具箱</h1>
        </div>
        
        <div class="content-body">
            <div class="section-title">🖼️ 图像识别</div>
            <div class="tools-grid">
                <a href="/image/general" class="tool-card">
                    <div class="icon">🖼️</div>
                    <div class="name">通用识别</div>
                    <div class="desc">上传图片，AI 自动识别内容并分析。支持多种场景：风景、文字、图表等。</div>
                    <span class="tag">多模态</span>
                </a>
                <a href="/image/generate" class="tool-card">
                    <div class="icon">🎨</div>
                    <div class="name">AI 绘图</div>
                    <div class="desc">通过文字描述自动生成图片，支持多种风格和尺寸，快速将创意变为视觉作品。</div>
                    <span class="tag">生成</span>
                </a>
            </div>
            

        </div>
    </main>
    
    <script>
        function navigate(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
