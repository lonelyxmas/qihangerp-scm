<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启航AI工作台 - 动态流</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .activity-filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; background: white; color: var(--text-secondary); transition: all 0.2s; }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .activity-timeline { position: relative; padding-left: 32px; }
        .activity-timeline::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: var(--border); }
        .activity-item { position: relative; margin-bottom: 20px; padding: 16px; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); transition: all 0.2s; }
        .activity-item:hover { box-shadow: var(--shadow-sm); }
        .activity-item::before { content: ''; position: absolute; left: -24px; top: 20px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid white; }
        .activity-item.type-note::before { background: #22c55e; }
        .activity-item.type-data::before { background: #3b82f6; }
        .activity-item.type-task::before { background: #f59e0b; }
        .activity-item.type-approval::before { background: #a855f7; }
        .activity-item.type-notification::before { background: #ec4899; }
        .activity-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .activity-type { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        .activity-type.note { background: rgba(34,197,94,0.1); color: #16a34a; }
        .activity-type.data { background: rgba(59,130,246,0.1); color: #2563eb; }
        .activity-type.task { background: rgba(245,158,11,0.1); color: #d97706; }
        .activity-type.approval { background: rgba(168,85,247,0.1); color: #9333ea; }
        .activity-type.notification { background: rgba(236,72,153,0.1); color: #db2777; }
        .activity-time { font-size: 12px; color: var(--text-muted); margin-left: auto; }
        .activity-desc { font-size: 14px; color: var(--text-primary); line-height: 1.6; }
        .activity-user { font-size: 12px; color: var(--text-secondary); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .activity-user .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }
        .activity-actions { display: flex; gap: 8px; margin-top: 8px; }
        .activity-actions a { font-size: 12px; color: var(--primary); text-decoration: none; }
        .activity-actions a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>
    <main class="main-content">
        <div class="content-header">
            <h1 class="content-title">动态流</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <span style="font-size:12px;color:var(--text-muted);">AI 协作动态实时追踪</span>
            </div>
        </div>
        <div class="content-body">
            <div class="activity-filters">
                <button class="filter-btn active" onclick="filterActivity('all', this)">全部</button>
                <button class="filter-btn" onclick="filterActivity('note', this)">知识库</button>
                <button class="filter-btn" onclick="filterActivity('data', this)">数据集</button>
                <button class="filter-btn" onclick="filterActivity('task', this)">任务</button>
                <button class="filter-btn" onclick="filterActivity('approval', this)">审批</button>
            </div>
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📜</div>
                <div class="empty-title">暂无动态</div>
                <div class="empty-desc">AI 协作操作将在这里实时展示，追溯每一次 AI 的操作记录</div>
            </div>
            <div class="activity-timeline" id="activityTimeline" style="display:none;"></div>
        </div>
    </main>
    <script>
        function filterActivity(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
