<h1 style="font-size:22px;font-weight:600;margin:0 0 20px;">🧰 工具箱</h1>

    <h2 style="font-size:16px;font-weight:600;margin:0 0 12px;color:#5c5f66;">🖼️ 图像识别</h2>
    <div class="tools-grid" style="margin-bottom:24px;">
        <a href="/image/general" class="tool-card">
            <div class="icon">🖼️</div>
            <div class="name">通用识别</div>
            <div class="desc">上传图片，AI 自动识别内容并分析。支持多种场景：风景、文字、图表等。</div>
            <span class="tag">多模态</span>
        </a>

        <a href="/image/solve" class="tool-card">
            <div class="icon">❓</div>
            <div class="name">识题</div>
            <div class="desc">拍照上传题目，AI 给出详细解答过程和答案。支持追问，深入理解。</div>
            <span class="tag">学习</span>
        </a>

        <a href="/image/exam" class="tool-card">
            <div class="icon">📝</div>
            <div class="name">试卷识别</div>

            <span class="tag">学习</span>
        </a>
    </div>

    <div class="tools-grid">
        <a href="/data/import" class="tool-card">
            <div class="icon">📥</div>

        </a>

        <a href="/data/collector" class="tool-card">
            <div class="icon">🔧</div>

        </a>

        <a href="/data/processing" class="tool-card">
            <div class="icon">📋</div>
            <div class="name">数据加工</div>
