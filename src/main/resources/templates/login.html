<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启航 AI 工作台 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: #fff; border-radius: 12px; padding: 40px; width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
        .login-header p { font-size: 14px; color: #999; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; transition: border-color 0.3s; outline: none;
        }
        .form-group input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-group .captcha-row { display: flex; gap: 10px; }
        .form-group .captcha-row input { flex: 1; }
        .form-group .captcha-row img { height: 44px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; }
        .login-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: opacity 0.3s;
        }
        .login-btn:hover { opacity: 0.9; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>启航 AI 工作台</h1>
            <p>Qihang AI Workbench</p>
        </div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <div id="errorMsg" class="error-msg"></div>
            <button type="submit" class="login-btn">登 录</button>
        </form>
    </div>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            try {
                const response = await fetch('/api/sys-api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                if (result.code === 200) {
                    localStorage.setItem('Admin-Token', result.token);
                    document.cookie = 'Admin-Token=' + result.token + '; path=/; max-age=86400; SameSite=Lax';
                    errorMsg.className = 'error-msg';
                    window.location.href = '/chat';
                } else {
                    errorMsg.textContent = result.msg || '登录失败';
                    errorMsg.className = 'error-msg show';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.className = 'error-msg show';
            }
            return false;
        }
    </script>
</body>
</html>
