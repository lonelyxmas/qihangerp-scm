<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启航AI工作台 - 通知中心</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <style>
        .notif-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .notif-tab { padding: 10px 20px; font-size: 14px; border: none; background: none; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all 0.2s; }
        .notif-tab:hover { color: var(--text-primary); }
        .notif-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
        .notif-tab .count { margin-left: 6px; padding: 1px 6px; background: var(--primary); color: white; border-radius: 10px; font-size: 11px; }
        .notif-tab .count.warn { background: #ef4444; }
        .notif-list { display: flex; flex-direction: column; gap: 8px; }
        .notif-item { display: flex; gap: 12px; padding: 16px; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); transition: all 0.2s; cursor: pointer; }
        .notif-item:hover { box-shadow: var(--shadow-sm); border-color: var(--primary-light); }
        .notif-item.unread { border-left: 3px solid var(--primary); background: rgba(99,102,241,0.02); }
        .notif-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .notif-body { flex: 1; min-width: 0; }
        .notif-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
        .notif-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .notif-time { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .notif-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 8px; }
        .notif-tag.task { background: rgba(245,158,11,0.1); color: #d97706; }
        .notif-tag.approval { background: rgba(168,85,247,0.1); color: #9333ea; }
        .notif-tag.system { background: rgba(148,163,184,0.1); color: #64748b; }
        .loading-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: loadPulse 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loadPulse { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <th:block th:replace="3.0/fragments/sidebar::sidebar(${currentNav})"></th:block>
    <main class="main-content" id="notifApp">
        <div class="content-header">
            <h1 class="content-title">通知中心</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" @click="markAllRead">全部已读</button>
            </div>
        </div>
        <div class="content-body">
            <div class="notif-tabs">
                <button v-for="t in tabs" :key="t.key" class="notif-tab"
                        :class="{ active: currentTab === t.key }"
                        @click="switchTab(t.key)">
                    {{ t.label }}
                    <span v-if="t.count !== undefined" class="count" :class="{ warn: t.key === 'all' && unreadCount > 0 }">{{ t.count }}</span>
                </button>
            </div>
            <div v-if="loading" class="empty-state">
                <div class="loading" style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--text-secondary);">
                    <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>加载中...
                </div>
            </div>
            <div v-else-if="items.length === 0" class="empty-state">
                <div class="empty-icon">🔔</div>
                <div class="empty-title">暂无通知</div>
                <div class="empty-desc">当有任务指派、审批请求或系统通知时，将在这里展示</div>
            </div>
            <div v-else class="notif-list">
                <div v-for="item in items" :key="item.id" class="notif-item"
                     :class="{ unread: item.isRead === 0 }"
                     @click="markRead(item)">
                    <div class="notif-icon" :style="notifIconStyle(item.type)">
                        {{ notifIcon(item.type) }}
                    </div>
                    <div class="notif-body">
                        <div class="notif-title">
                            {{ item.title }}
                            <span class="notif-tag" :class="item.type">{{ typeLabel(item.type) }}</span>
                        </div>
                        <div class="notif-desc">{{ item.content }}</div>
                        <div class="notif-time">{{ item.createdAt }}</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        function apiFetch(url, options) {
            if (!options) options = {};
            if (!options.headers) options.headers = {};
            var token = localStorage.getItem('Admin-Token');
            if (token) options.headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, options);
        }

        function checkAuthBeforeFetch(url, opts) {
            return apiFetch(url, opts).then(function(r) {
                if (r.status === 401 || r.status === 403) return r.json().then(function(d) { d.__401 = true; return d; });
                if (!r.ok) throw new Error('请求失败');
                return r.json();
            });
        }

        function isAuthError(d) {
            return d.__401 || (d.code === 500 && d.msg === '认证失败');
        }

        function handleUnauthenticated() {
            localStorage.removeItem('Admin-Token');
            document.cookie = 'Admin-Token=; path=/; max-age=0; SameSite=Lax';
            document.getElementById('notifApp').innerHTML = '<div class="content-header"><h1 class="content-title">通知中心</h1></div><div class="content-body"><div class="empty-state"><div class="empty-icon">🔐</div><div class="empty-title">需要登录</div><div class="empty-desc">登录后即可查看通知</div></div></div>';
            showLoginModal(function() { window.location.href = window.location.href; });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('Admin-Token')) { handleUnauthenticated(); return; }
        });

        document.addEventListener('auth-change', function() {
            if (!localStorage.getItem('Admin-Token')) handleUnauthenticated();
        });

        createApp({
            setup() {
                const userId = 1;
                const items = ref([]);
                const loading = ref(true);
                const unreadCount = ref(0);
                const currentTab = ref('all');
                const tabs = ref([
                    { key: 'all', label: '全部' },
                    { key: 'task_assignment', label: '任务' },
                    { key: 'approval_request', label: '审批' },
                    { key: 'system', label: '系统' }
                ]);

                async function loadData() {
                    loading.value = true;
                    try {
                        let url = '/api/collab/notification/list?userId=' + userId + '&limit=50';
                        if (currentTab.value !== 'all') {
                            url += '&type=' + currentTab.value;
                        }
                        const r = await checkAuthBeforeFetch(url);
                        if (isAuthError(r)) { handleUnauthenticated(); return; }
                        if (r.ok) {
                            items.value = r.data;
                            unreadCount.value = r.unreadCount || 0;
                            updateTabCounts();
                        }
                    } catch (e) {
                        console.error(e);
                    } finally {
                        loading.value = false;
                    }
                }

                function updateTabCounts() {
                    tabs.value[0].count = unreadCount.value;
                    const taskCount = items.value.filter(i => i.type === 'task_assignment' && i.isRead === 0).length;
                    const approvalCount = items.value.filter(i => i.type === 'approval_request' && i.isRead === 0).length;
                    tabs.value[1].count = taskCount || undefined;
                    tabs.value[2].count = approvalCount || undefined;
                }

                function switchTab(key) {
                    currentTab.value = key;
                    loadData();
                }

                async function markRead(item) {
                    if (item.isRead === 1) return;
                    try {
                        const r = await checkAuthBeforeFetch('/api/collab/notification/mark-read?id=' + item.id, { method: 'POST' });
                        if (isAuthError(r)) { handleUnauthenticated(); return; }
                        item.isRead = 1;
                        unreadCount.value = Math.max(0, unreadCount.value - 1);
                        updateTabCounts();
                    } catch (e) { console.error(e); }
                }

                async function markAllRead() {
                    try {
                        const r = await checkAuthBeforeFetch('/api/collab/notification/mark-all-read?userId=' + userId, { method: 'POST' });
                        if (isAuthError(r)) { handleUnauthenticated(); return; }
                        items.value.forEach(i => i.isRead = 1);
                        unreadCount.value = 0;
                        updateTabCounts();
                    } catch (e) { console.error(e); }
                }

                function notifIcon(type) {
                    if (type === 'task_assignment') return '📋';
                    if (type === 'approval_request') return '✅';
                    if (type === 'approval_result') return '📌';
                    if (type === 'reminder') return '⏰';
                    return '🔔';
                }

                function notifIconStyle(type) {
                    if (type === 'task_assignment') return 'background:rgba(245,158,11,0.1)';
                    if (type === 'approval_request' || type === 'approval_result') return 'background:rgba(168,85,247,0.1)';
                    if (type === 'reminder') return 'background:rgba(59,130,246,0.1)';
                    return 'background:rgba(148,163,184,0.1)';
                }

                function typeLabel(type) {
                    if (type === 'task_assignment') return '任务';
                    if (type === 'approval_request') return '审批';
                    if (type === 'approval_result') return '审批';
                    if (type === 'reminder') return '提醒';
                    return '系统';
                }

                onMounted(loadData);
                return { items, loading, unreadCount, currentTab, tabs, switchTab, markRead, markAllRead, notifIcon, notifIconStyle, typeLabel };
            }
        }).mount('#notifApp');
    </script>
</body>
</html>
